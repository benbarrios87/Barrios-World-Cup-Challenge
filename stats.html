<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stats | FC Barrios World Cup Challenge 2026</title>

<style>
:root{
  --card:rgba(7,14,28,0.84);
  --soft:rgba(255,255,255,0.08);
  --line:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.72);
  --green:#2ecc71;
  --gold:#ffd166;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.24), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,209,102,0.14), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(90deg,#0b3d24 0px,#0b3d24 90px,#0e4a2c 90px,#0e4a2c 180px);
}

.wrapper{
  max-width:1100px;
  margin:auto;
  padding:22px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:white;
  text-decoration:none;
  opacity:0.8;
}

.hero{
  text-align:center;
  margin-bottom:24px;
}

.badge{
  display:inline-block;
  margin-bottom:12px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(46,204,113,0.18);
  color:#9dffc7;
  font-size:13px;
  font-weight:bold;
}

h1{
  margin:0 0 10px;
  font-size:42px;
  line-height:1.05;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 16px 40px rgba(0,0,0,0.32);
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat-box{
  background:var(--soft);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.stat-box strong{
  display:block;
  font-size:30px;
  color:var(--gold);
  margin-bottom:5px;
}

.stat-box span{
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}

.section-title{
  margin:0 0 16px;
  font-size:24px;
}

.leader-grid,
.split-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.leader-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
}

.leader-card .label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.leader-card .name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

.leader-card .value{
  color:var(--gold);
  font-weight:bold;
}

.list-row{
  display:grid;
  grid-template-columns:38px 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.list-row:last-child{ border-bottom:none; }

.rank{
  font-weight:bold;
  color:var(--gold);
}

.name{ font-weight:bold; }

.value{ color:var(--muted); }

.pill-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:999px;
  padding:7px 11px;
  font-size:13px;
}

.loading{
  color:var(--muted);
  text-align:center;
  padding:30px;
}

.footer-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:850px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .leader-grid,.split-grid{ grid-template-columns:1fr; }
}

@media(max-width:520px){
  .wrapper{ padding:14px; }
  h1{ font-size:32px; }
  .grid{ grid-template-columns:1fr; }
  .card{ padding:17px; border-radius:20px; }
  .list-row{ grid-template-columns:32px 1fr; }
  .list-row .value{ grid-column:2; }
}
</style>
</head>

<body>

<div class="wrapper">

  <a class="back-link" href="index.html">← Til forsiden</a>

  <div class="hero">
    <div class="badge">FC BARRIOS • STATS</div>
    <h1>Statscentralen</h1>
    <p>Her samles tallene, heltene, outsider-kongene og de statistiske unnskyldningene.</p>
  </div>

  <div id="content">
    <div class="card loading">Laster stats...</div>
  </div>

  <div class="footer-note">
    FC Barrios World Cup Challenge 2026
  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const REGISTRATIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;
const SUBMISSIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;
const MATCHES_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;
const RESULTS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_RESULTS`;
const OUTCOME_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_OUTCOME`;
const DIFF_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_DIFF`;
const EXACT_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_EXACT`;

const BUY_IN = 600;
const FREE_ENTRIES = 1;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();
    if(!Array.isArray(data)) return [];
    return data.map(normalizeRow);
  }catch(error){
    console.error(error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};

  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });

  return clean;
}

function isBlank(value){
  return value === "" || value === null || value === undefined;
}

function cleanNumber(value){
  if(isBlank(value)) return 0;
  return Number(String(value).replace(/\s/g,"").replace(",",".")) || 0;
}

function parseTier(value){
  if(isBlank(value)) return 4;
  const found = String(value).match(/[1-4]/);
  return found ? Number(found[0]) : 4;
}

function getOutcome(home,away){
  home = cleanNumber(home);
  away = cleanNumber(away);

  if(home > away) return "home";
  if(away > home) return "away";
  return "draw";
}

function getTierType(match,outcome){
  if(outcome === "draw") return "draw";

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);

  if(outcome === "home"){
    return homeTier <= awayTier ? "favorite" : "underdog";
  }

  if(outcome === "away"){
    return awayTier <= homeTier ? "favorite" : "underdog";
  }

  return "draw";
}

function getRulePoint(rules,tierDiff,type){
  const row = rules.find(r => cleanNumber(r.tier_diff) === cleanNumber(tierDiff));
  if(!row) return 0;

  if(type === "favorite") return cleanNumber(row.favorite || row.favoritt);
  if(type === "draw") return cleanNumber(row.draw || row.uavgjort);
  if(type === "underdog") return cleanNumber(row.underdog || row.outsider);

  return 0;
}

function hasResult(result){
  return result &&
    !isBlank(result.actual_home) &&
    !isBlank(result.actual_away);
}

function getLatestRowsForPhone(rows,phone){
  const userRows = rows.filter(row =>
    String(row.phone || "").trim() === String(phone || "").trim()
  );

  if(userRows.length === 0) return [];

  const latestTimestamp = userRows[userRows.length - 1].timestamp;

  return userRows.filter(row => row.timestamp === latestTimestamp);
}

function isSubmissionComplete(rows,totalMatches){
  const matchRows = rows.filter(row => row.type === "match");

  if(matchRows.length < totalMatches) return false;

  const missingTips = matchRows.some(row =>
    isBlank(row.tips_home) || isBlank(row.tips_away)
  );

  if(missingTips) return false;

  const bestTotal = rows
    .filter(row => row.type === "bestplayer")
    .reduce((sum,row) => sum + cleanNumber(row.extra_points),0);

  const scorerTotal = rows
    .filter(row => row.type === "topscorer")
    .reduce((sum,row) => sum + cleanNumber(row.extra_points),0);

  return bestTotal === 10 && scorerTotal === 10;
}

function calculatePlayer(rows,matchesById,resultsById,outcomeRules,diffRules,exactRules){
  let points = 0;
  let exact = 0;
  let outcome = 0;
  let diff = 0;
  let underdog = 0;
  let played = 0;

  rows
    .filter(row => row.type === "match")
    .forEach(tip => {
      const matchId = String(tip.match_id || tip.id || "").trim();
      const match = matchesById[matchId];
      const result = resultsById[matchId];

      if(!match || !hasResult(result)) return;

      played++;

      if(isBlank(tip.tips_home) || isBlank(tip.tips_away)) return;

      const tipHome = cleanNumber(tip.tips_home);
      const tipAway = cleanNumber(tip.tips_away);
      const actualHome = cleanNumber(result.actual_home);
      const actualAway = cleanNumber(result.actual_away);

      const tipOutcome = getOutcome(tipHome,tipAway);
      const actualOutcome = getOutcome(actualHome,actualAway);

      const tipDiff = tipHome - tipAway;
      const actualDiff = actualHome - actualAway;

      const homeTier = parseTier(match.tier_home);
      const awayTier = parseTier(match.tier_away);
      const tierDiff = Math.abs(homeTier - awayTier);
      const tierType = getTierType(match,tipOutcome);

      let added = 0;

      if(tipHome === actualHome && tipAway === actualAway){
        added = getRulePoint(exactRules,tierDiff,tierType);
        exact++;
      }else if(tipDiff === actualDiff){
        added = getRulePoint(diffRules,tierDiff,tierType);
        diff++;
      }else if(tipOutcome === actualOutcome){
        added = getRulePoint(outcomeRules,tierDiff,tierType);
        outcome++;
      }

      if(added > 0 && tierType === "underdog"){
        underdog++;
      }

      points += added;
    });

  return {points, exact, outcome, diff, underdog, played};
}

function getFullName(row){
  return (
    row.full_name ||
    row["full name"] ||
    `${row.first_name || row["first name"] || ""} ${row.last_name || row["last name"] || ""}`.trim()
  );
}

function topRows(rows,key,label,count = 5){
  const sorted = [...rows]
    .filter(row => cleanNumber(row[key]) > 0)
    .sort((a,b) => cleanNumber(b[key]) - cleanNumber(a[key]))
    .slice(0,count);

  if(!sorted.length){
    return `<div style="color:rgba(255,255,255,0.7);">Ingen data ennå.</div>`;
  }

  return sorted.map((row,index) => `
    <div class="list-row">
      <div class="rank">${index + 1}.</div>
      <div class="name">${row.name}</div>
      <div class="value">${cleanNumber(row[key])} ${label}</div>
    </div>
  `).join("");
}

function getLeader(rows,key){
  const sorted = [...rows]
    .filter(row => cleanNumber(row[key]) > 0)
    .sort((a,b) => cleanNumber(b[key]) - cleanNumber(a[key]));

  return sorted[0] || null;
}

function formatKr(value){
  return value.toLocaleString("no-NO") + " kr";
}

async function loadStats(){
  const content = document.getElementById("content");

  try{
    const [
      registrations,
      submissions,
      matches,
      results,
      outcomeRules,
      diffRules,
      exactRules
    ] = await Promise.all([
      fetchSheet(REGISTRATIONS_URL),
      fetchSheet(SUBMISSIONS_URL),
      fetchSheet(MATCHES_URL),
      fetchSheet(RESULTS_URL),
      fetchSheet(OUTCOME_URL),
      fetchSheet(DIFF_URL),
      fetchSheet(EXACT_URL)
    ]);

    const matchesById = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchesById[id] = match;
    });

    const resultsById = {};
    results.forEach(result => {
      const id = String(result.id || result.match_id || "").trim();
      if(id) resultsById[id] = result;
    });

    const uniqueMap = new Map();

    registrations.forEach(row => {
      const phone = String(row.phone || "").trim();
      const name = getFullName(row);

      if(!phone || !name) return;

      if(!uniqueMap.has(phone)){
        uniqueMap.set(phone,{phone,name});
      }
    });

    const rows = [...uniqueMap.values()].map(player => {
      const latestRows = getLatestRowsForPhone(submissions,player.phone);
      const score = calculatePlayer(
        latestRows,
        matchesById,
        resultsById,
        outcomeRules,
        diffRules,
        exactRules
      );

      return {
        ...player,
        ...score,
        complete:isSubmissionComplete(latestRows,matches.length)
      };
    }).sort((a,b) =>
      cleanNumber(b.points) - cleanNumber(a.points) ||
      cleanNumber(b.exact) - cleanNumber(a.exact) ||
      a.name.localeCompare(b.name,"no")
    );

    const registeredCount = rows.length;
    const completedCount = rows.filter(row => row.complete).length;
    const missingCount = Math.max(0, registeredCount - completedCount);
    const paidPlayers = Math.max(0, registeredCount - FREE_ENTRIES);
    const pot = paidPlayers * BUY_IN;

    const totalPoints = rows.reduce((sum,row) => sum + row.points,0);
    const totalExact = rows.reduce((sum,row) => sum + row.exact,0);
    const totalOutcome = rows.reduce((sum,row) => sum + row.outcome,0);
    const totalUnderdog = rows.reduce((sum,row) => sum + row.underdog,0);

    const playedMatches = results.filter(hasResult).length;

    const pointsLeader = rows.find(row => row.points > 0) || null;
    const exactLeader = getLeader(rows,"exact");
    const underdogLeader = getLeader(rows,"underdog");
    const diffLeader = getLeader(rows,"diff");

    const missingNames = rows
      .filter(row => !row.complete)
      .map(row => row.name);

    content.innerHTML = `
      <div class="card">
        <div class="grid">
          <div class="stat-box">
            <strong>${registeredCount}</strong>
            <span>registrerte deltakere</span>
          </div>

          <div class="stat-box">
            <strong>${completedCount}</strong>
            <span>har fullført tips</span>
          </div>

          <div class="stat-box">
            <strong>${missingCount}</strong>
            <span>mangler fullført tips</span>
          </div>

          <div class="stat-box">
            <strong>${formatKr(pot)}</strong>
            <span>foreløpig premiepott</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Konkurransen akkurat nå</h2>

        <div class="grid">
          <div class="stat-box">
            <strong>${totalPoints}</strong>
            <span>poeng delt ut</span>
          </div>

          <div class="stat-box">
            <strong>${totalExact}</strong>
            <span>eksakte treff totalt</span>
          </div>

          <div class="stat-box">
            <strong>${totalOutcome}</strong>
            <span>riktige utfall totalt</span>
          </div>

          <div class="stat-box">
            <strong>${playedMatches}</strong>
            <span>kamper med resultat</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Foreløpige helter</h2>

        <div class="leader-grid">
          <div class="leader-card">
            <div class="label">Leder sammenlagt</div>
            <div class="name">${pointsLeader ? pointsLeader.name : "Ingen ennå"}</div>
            <div class="value">${pointsLeader ? pointsLeader.points + " poeng" : "-"}</div>
          </div>

          <div class="leader-card">
            <div class="label">Mest presis</div>
            <div class="name">${exactLeader ? exactLeader.name : "Ingen ennå"}</div>
            <div class="value">${exactLeader ? exactLeader.exact + " eksakte" : "-"}</div>
          </div>

          <div class="leader-card">
            <div class="label">Outsider-kongen</div>
            <div class="name">${underdogLeader ? underdogLeader.name : "Ingen ennå"}</div>
            <div class="value">${underdogLeader ? underdogLeader.underdog + " outsider-treff" : "-"}</div>
          </div>

          <div class="leader-card">
            <div class="label">Marginmesteren</div>
            <div class="name">${diffLeader ? diffLeader.name : "Ingen ennå"}</div>
            <div class="value">${diffLeader ? diffLeader.diff + " diff" : "-"}</div>
          </div>
        </div>
      </div>

      <div class="split-grid">
        <div class="card">
          <h2 class="section-title">Topp 5 sammenlagt</h2>
          ${topRows(rows,"points","poeng")}
        </div>

        <div class="card">
          <h2 class="section-title">Flest eksakte</h2>
          ${topRows(rows,"exact","eksakte")}
        </div>
      </div>

      <div class="split-grid">
        <div class="card">
          <h2 class="section-title">Mest outsider-treff</h2>
          ${topRows(rows,"underdog","treff")}
        </div>

        <div class="card">
          <h2 class="section-title">Flest diff-treff</h2>
          ${topRows(rows,"diff","diff")}
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Mangler fullført tips</h2>

        ${
          missingNames.length
          ? `<div class="pill-wrap">
              ${missingNames.map(name => `<span class="pill">${name}</span>`).join("")}
            </div>`
          : `<div style="color:#9dffc7;font-weight:bold;">Alle har fullført tips. Urovekkende profesjonelt.</div>`
        }
      </div>

      <div class="card">
  <h2 class="section-title">Nerdehjørnet</h2>

  <div class="grid">
    <div class="stat-box">
      <strong>${matches.length}</strong>
      <span>kamper i systemet</span>
    </div>

    <div class="stat-box">
      <strong>${playedMatches}</strong>
      <span>kamper med resultat</span>
    </div>

    <div class="stat-box">
      <strong>${totalUnderdog}</strong>
      <span>outsider-treff totalt</span>
    </div>

    <div class="stat-box">
      <strong>${Math.round(totalPoints / Math.max(1, playedMatches))}</strong>
      <span>poeng per kampdag-ish</span>
    </div>
  </div>
</div>
          </div>
        </div>
      </div>
    `;

  }catch(error){
    console.error(error);

    content.innerHTML = `
      <div class="card" style="color:#ffb4b4;">
        Klarte ikke å laste stats akkurat nå.
      </div>
    `;
  }
}

loadStats();
setInterval(loadStats,30000);
</script>

</body>
</html>
