<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mine tips | FC Barrios World Cup Challenge</title>

<style>
:root{
  --card:rgba(7,14,28,0.84);
  --line:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.72);
  --green:#2ecc71;
  --gold:#ffd166;
  --red:#ff5e5e;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.24), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,209,102,0.14), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(90deg,#0b3d24 0px,#0b3d24 90px,#0e4a2c 90px,#0e4a2c 180px);
}

.wrapper{
  max-width:980px;
  margin:auto;
  padding:22px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:white;
  text-decoration:none;
  opacity:0.8;
}

.hero{
  text-align:center;
  margin-bottom:22px;
}

.badge{
  display:inline-block;
  margin-bottom:12px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(46,204,113,0.18);
  color:#9dffc7;
  font-size:13px;
  font-weight:bold;
}

h1{
  margin:0 0 10px;
  font-size:40px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 16px 40px rgba(0,0,0,0.32);
}

.search-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:16px;
  outline:none;
}

button{
  border:none;
  cursor:pointer;
  padding:16px 20px;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
  color:#07111f;
  background:linear-gradient(135deg,var(--green),#7dffba);
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.status-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.status-card strong{
  display:block;
  font-size:25px;
  margin-bottom:4px;
}

.status-card span{
  color:var(--muted);
  font-size:13px;
}

.section-title{
  font-size:22px;
  margin:0 0 14px;
}

.match-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.match-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.match-name{
  font-weight:bold;
  font-size:17px;
}

.match-id{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.tip-score{
  font-size:22px;
  font-weight:bold;
  color:var(--gold);
  white-space:nowrap;
}

.extra-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.extra-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
}

.extra-card strong{
  display:block;
  color:var(--gold);
  margin-bottom:8px;
}

.extra-card span{
  color:var(--muted);
  line-height:1.6;
}

.message{
  color:var(--muted);
  line-height:1.6;
}

.error{
  color:#ffb4b4;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:16px;
}

.action-link{
  display:inline-block;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:13px 16px;
  font-weight:bold;
}

.action-link.primary{
  color:#07111f;
  background:linear-gradient(135deg,var(--green),#7dffba);
}

.footer-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:700px){
  .wrapper{ padding:14px; }
  h1{ font-size:30px; }
  .search-row{ grid-template-columns:1fr; }
  .status-grid{ grid-template-columns:1fr; }
  .extra-grid{ grid-template-columns:1fr; }
  .match-top{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<div class="wrapper">

  <a class="back-link" href="index.html">← Til forsiden</a>

  <div class="hero">
    <div class="badge">FC BARRIOS • VM 2026</div>
    <h1>Mine tips</h1>
    <p>Skriv inn telefonnummeret ditt og se siste lagrede/innsendte tips.</p>
  </div>

  <div class="card">
    <div class="search-row">
      <input
        id="phoneInput"
        type="tel"
        maxlength="8"
        inputmode="numeric"
        placeholder="Skriv telefonnummeret ditt, 8 siffer"
      >

      <button onclick="findTips()">Hent mine tips</button>
    </div>

    <div class="actions">
      <a class="action-link primary" href="tips.html">Lever eller endre tips</a>
      <a class="action-link" href="leaderboard.html">Se leaderboard</a>
    </div>
  </div>

  <div id="result"></div>

  <div class="footer-note">
    FC Barrios World Cup Challenge 2026
  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const SUBMISSIONS_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;

const MATCHES_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;

const REGISTRATIONS_URL =
  `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();

    if(!Array.isArray(data)) return [];

    return data.map(normalizeRow);
  }catch(error){
    console.error(error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};

  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });

  return clean;
}

function isBlank(value){
  return value === "" || value === null || value === undefined;
}

function cleanNumber(value){
  if(value === undefined || value === null || value === "") return 0;
  return Number(String(value).replace(/\s/g,"").replace(",",".")) || 0;
}

function getMatchLabel(match){
  if(!match) return "Ukjent kamp";

  const home = match.home || "";
  const away = match.away || "";

  if(home || away){
    return `${home} - ${away}`;
  }

  return `Kamp ${match.id || match.match_id || ""}`;
}

function getLatestRowsForPhone(rows, phone){
  const userRows = rows.filter(row =>
    String(row.phone || "").trim() === phone
  );

  if(userRows.length === 0) return [];

  const latestTimestamp = userRows[userRows.length - 1].timestamp;

  return userRows.filter(row =>
    row.timestamp === latestTimestamp
  );
}

function getRegisteredName(registrations, phone){
  const person = registrations.find(row =>
    String(row.phone || "").trim() === phone
  );

  if(!person) return "";

  return (
    person.full_name ||
    person["full name"] ||
    `${person.first_name || person["first name"] || ""} ${person.last_name || person["last name"] || ""}`.trim()
  );
}

function isSubmissionComplete(matchRows,bestPlayerRows,topScorerRows,totalMatches){
  if(matchRows.length < totalMatches) return false;

  const missingTips = matchRows.some(row =>
    isBlank(row.tips_home) || isBlank(row.tips_away)
  );

  if(missingTips) return false;

  const bestTotal = bestPlayerRows.reduce((sum,row) =>
    sum + cleanNumber(row.extra_points),0
  );

  const scorerTotal = topScorerRows.reduce((sum,row) =>
    sum + cleanNumber(row.extra_points),0
  );

  return bestTotal === 10 && scorerTotal === 10;
}

function renderBonusRows(rows){
  if(rows.length === 0) return "Ikke fylt ut";

  return rows
    .filter(row => cleanNumber(row.extra_points) > 0)
    .map(row => `${row.extra_name}: ${row.extra_points} poeng`)
    .join("<br>") || "0 poeng fordelt";
}

async function findTips(){
  const result = document.getElementById("result");
  const inputPhone = document.getElementById("phoneInput").value.trim();

  result.innerHTML = `
    <div class="card message">
      Laster tips...
    </div>
  `;

  if(!/^\d{8}$/.test(inputPhone)){
    result.innerHTML = `
      <div class="card message error">
        Skriv inn et gyldig telefonnummer.
      </div>
    `;
    return;
  }

  try{
    const [submissions, matches, registrations] = await Promise.all([
      fetchSheet(SUBMISSIONS_URL),
      fetchSheet(MATCHES_URL),
      fetchSheet(REGISTRATIONS_URL)
    ]);

    const latestRows = getLatestRowsForPhone(submissions, inputPhone);

    if(latestRows.length === 0){
      result.innerHTML = `
        <div class="card message error">
          Fant ingen tips på dette telefonnummeret.
          <br><br>
          Sjekk nummeret, eller lever tips først.
        </div>
      `;
      return;
    }

    const matchMap = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchMap[id] = match;
    });

    const matchRows = latestRows.filter(row => row.type === "match");
    const bestPlayerRows = latestRows.filter(row => row.type === "bestplayer");
    const topScorerRows = latestRows.filter(row => row.type === "topscorer");

    const completedTips = matchRows.filter(row =>
      !isBlank(row.tips_home) && !isBlank(row.tips_away)
    ).length;

    const complete = isSubmissionComplete(
      matchRows,
      bestPlayerRows,
      topScorerRows,
      matches.length
    );

    const statusText = complete ? "Fullført" : "Kladd/ikke fullført";
    const statusColor = complete ? "#9dffc7" : "#ffb4b4";

    const registeredName = getRegisteredName(registrations, inputPhone);
    const displayName = registeredName || "Ukjent deltaker";

    result.innerHTML = `
      <div class="card">
        <h2 class="section-title">${displayName}</h2>

        <div class="status-grid">
          <div class="status-card">
            <strong style="color:${statusColor};">${statusText}</strong>
            <span>Status</span>
          </div>

          <div class="status-card">
            <strong>${completedTips}/${matches.length}</strong>
            <span>Kamptips fylt ut</span>
          </div>

          <div class="status-card">
            <strong>${bestPlayerRows.length + topScorerRows.length}</strong>
            <span>Bonusrader</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Bonusvalg</h2>

        <div class="extra-grid">
          <div class="extra-card">
            <strong>Beste spiller</strong>
            <span>${renderBonusRows(bestPlayerRows)}</span>
          </div>

          <div class="extra-card">
            <strong>Toppscorer</strong>
            <span>${renderBonusRows(topScorerRows)}</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Kamptips</h2>

        ${matchRows.map(row => {
          const matchId = String(row.match_id || row.id || "").trim();
          const match = matchMap[matchId];

          const homeScore = row.tips_home;
          const awayScore = row.tips_away;

          return `
            <div class="match-card">
              <div class="match-top">
                <div>
                  <div class="match-name">${getMatchLabel(match)}</div>
                  <div class="match-id">Kamp ${matchId}</div>
                </div>

                <div class="tip-score">
                  ${isBlank(homeScore) || isBlank(awayScore)
                    ? "Mangler"
                    : `${homeScore} - ${awayScore}`
                  }
                </div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;

  }catch(error){
    console.error(error);

    result.innerHTML = `
      <div class="card message error">
        Klarte ikke å hente tips akkurat nå.
      </div>
    `;
  }
}

document.getElementById("phoneInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g,"").slice(0,8);
});

document.getElementById("phoneInput").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    findTips();
  }
});
</script>

</body>
</html>
