<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine tips | FC Barrios World Cup Challenge 2026</title>

<style>
:root{
  --card:rgba(7,14,28,0.84);
  --line:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.72);
  --green:#2ecc71;
  --gold:#ffd166;
  --red:#ff5e5e;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.24), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,209,102,0.14), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(90deg,#0b3d24 0px,#0b3d24 90px,#0e4a2c 90px,#0e4a2c 180px);
}

.wrapper{
  max-width:1000px;
  margin:auto;
  padding:22px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:white;
  text-decoration:none;
  opacity:0.8;
}

.hero{
  text-align:center;
  margin-bottom:22px;
}

.badge{
  display:inline-block;
  margin-bottom:12px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(46,204,113,0.18);
  color:#9dffc7;
  font-size:13px;
  font-weight:bold;
}

h1{
  margin:0 0 10px;
  font-size:40px;
}

.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 16px 40px rgba(0,0,0,0.32);
}

.search-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:16px;
  outline:none;
}

button{
  border:none;
  cursor:pointer;
  padding:16px 20px;
  border-radius:16px;
  font-size:16px;
  font-weight:bold;
  color:#07111f;
  background:linear-gradient(135deg,var(--green),#7dffba);
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:16px;
}

.action-link{
  display:inline-block;
  text-decoration:none;
  color:white;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px;
  padding:13px 16px;
  font-weight:bold;
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:18px;
}

.status-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.status-card strong{
  display:block;
  font-size:25px;
  margin-bottom:4px;
}

.status-card span{
  color:var(--muted);
  font-size:13px;
}

.section-title{
  font-size:22px;
  margin:0 0 14px;
}

.match-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.match-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.match-name{
  font-weight:bold;
  font-size:17px;
}

.match-id{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.score-line{
  font-size:20px;
  font-weight:bold;
  color:var(--gold);
  white-space:nowrap;
  text-align:right;
}

.match-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;
  padding:6px 10px;
  font-size:13px;
}

.pill.good{
  background:rgba(46,204,113,0.14);
  border-color:rgba(46,204,113,0.25);
  color:#9dffc7;
}

.pill.bad{
  background:rgba(255,94,94,0.12);
  border-color:rgba(255,94,94,0.25);
  color:#ffb4b4;
}

.pill.gold{
  background:rgba(255,209,102,0.13);
  border-color:rgba(255,209,102,0.25);
  color:var(--gold);
}

.extra-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.extra-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
}

.extra-card strong{
  display:block;
  color:var(--gold);
  margin-bottom:8px;
}

.extra-card span{
  color:var(--muted);
  line-height:1.6;
}

.message{
  color:var(--muted);
  line-height:1.6;
}

.error{
  color:#ffb4b4;
}

.footer-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:700px){
  .wrapper{ padding:14px; }
  h1{ font-size:30px; }
  .search-row{ grid-template-columns:1fr; }
  .status-grid{ grid-template-columns:1fr 1fr; }
  .extra-grid{ grid-template-columns:1fr; }
  .match-top{ grid-template-columns:1fr; }
  .score-line{ text-align:left; }
}
</style>
</head>

<body>

<div class="wrapper">

  <a class="back-link" href="index.html">← Til forsiden</a>

  <div class="hero">
    <div class="badge">FC BARRIOS • VM 2026</div>
    <h1>Mine tips</h1>
    <p>Skriv inn telefonnummeret ditt og se hva du leverte, hva resultatet ble og hvor mange poeng du fikk.</p>
  </div>

  <div class="card">
    <div class="search-row">
      <input
        id="phoneInput"
        type="tel"
        maxlength="8"
        inputmode="numeric"
        placeholder="Skriv telefonnummeret ditt, 8 siffer"
      >
      <button onclick="findTips()">Hent mine tips</button>
    </div>

    <div class="actions">
      <a class="action-link" href="leaderboard.html">Se leaderboard</a>
      <a class="action-link" href="tips.html">Til innlevering</a>
    </div>
  </div>

  <div id="result"></div>

  <div class="footer-note">
    FC Barrios World Cup Challenge 2026
  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const SUBMISSIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;
const MATCHES_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;
const RESULTS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_RESULTS`;
const REGISTRATIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;
const OUTCOME_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_OUTCOME`;
const DIFF_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_DIFF`;
const EXACT_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_EXACT`;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();
    if(!Array.isArray(data)) return [];
    return data.map(normalizeRow);
  }catch(error){
    console.error(error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};
  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });
  return clean;
}

function isBlank(value){
  return value === "" || value === null || value === undefined;
}

function cleanNumber(value){
  if(isBlank(value)) return 0;
  return Number(String(value).replace(/\s/g,"").replace(",",".")) || 0;
}

function parseTier(value){
  if(isBlank(value)) return 4;
  const found = String(value).match(/[1-4]/);
  return found ? Number(found[0]) : 4;
}

function getOutcome(home,away){
  home = cleanNumber(home);
  away = cleanNumber(away);
  if(home > away) return "home";
  if(away > home) return "away";
  return "draw";
}

function getTierType(match,outcome){
  if(outcome === "draw") return "draw";

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);

  if(outcome === "home"){
    return homeTier <= awayTier ? "favorite" : "underdog";
  }

  if(outcome === "away"){
    return awayTier <= homeTier ? "favorite" : "underdog";
  }

  return "draw";
}

function getRulePoint(rules,tierDiff,type){
  const row = rules.find(r => cleanNumber(r.tier_diff) === cleanNumber(tierDiff));
  if(!row) return 0;

  if(type === "favorite") return cleanNumber(row.favorite || row.favoritt);
  if(type === "draw") return cleanNumber(row.draw || row.uavgjort);
  if(type === "underdog") return cleanNumber(row.underdog || row.outsider);

  return 0;
}

function getMatchLabel(match){
  if(!match) return "Ukjent kamp";

  const home = match.home || "";
  const away = match.away || "";

  if(home || away){
    return `${home} - ${away}`;
  }

  return `Kamp ${match.id || match.match_id || ""}`;
}

function getLatestRowsForPhone(rows, phone){
  const userRows = rows.filter(row =>
    String(row.phone || "").trim() === phone
  );

  if(userRows.length === 0) return [];

  const latestTimestamp = userRows[userRows.length - 1].timestamp;

  return userRows.filter(row =>
    row.timestamp === latestTimestamp
  );
}

function getRegisteredName(registrations, phone){
  const person = registrations.find(row =>
    String(row.phone || "").trim() === phone
  );

  if(!person) return "";

  return (
    person.full_name ||
    person["full name"] ||
    `${person.first_name || person["first name"] || ""} ${person.last_name || person["last name"] || ""}`.trim()
  );
}

function hasResult(result){
  return result &&
    !isBlank(result.actual_home) &&
    !isBlank(result.actual_away);
}

function calculateMatch(tip, match, result, outcomeRules, diffRules, exactRules){
  if(!match || !hasResult(result)){
    return {
      status:"Ikke spilt",
      points:0,
      className:"",
      actualText:"Ikke spilt"
    };
  }

  if(isBlank(tip.tips_home) || isBlank(tip.tips_away)){
    return {
      status:"Mangler tips",
      points:0,
      className:"bad",
      actualText:`${result.actual_home} - ${result.actual_away}`
    };
  }

  const tipHome = cleanNumber(tip.tips_home);
  const tipAway = cleanNumber(tip.tips_away);
  const actualHome = cleanNumber(result.actual_home);
  const actualAway = cleanNumber(result.actual_away);

  const tipOutcome = getOutcome(tipHome,tipAway);
  const actualOutcome = getOutcome(actualHome,actualAway);

  const tipDiff = tipHome - tipAway;
  const actualDiff = actualHome - actualAway;

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);
  const tierDiff = Math.abs(homeTier - awayTier);
  const tierType = getTierType(match,tipOutcome);

  if(tipHome === actualHome && tipAway === actualAway){
    return {
      status:"Eksakt resultat",
      points:getRulePoint(exactRules,tierDiff,tierType),
      className:"gold",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipDiff === actualDiff){
    return {
      status:"Riktig målforskjell",
      points:getRulePoint(diffRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipOutcome === actualOutcome){
    return {
      status:"Riktig utfall",
      points:getRulePoint(outcomeRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  return {
    status:"Bom",
    points:0,
    className:"bad",
    actualText:`${actualHome} - ${actualAway}`
  };
}

function renderBonusRows(rows){
  const positive = rows.filter(row => cleanNumber(row.extra_points) > 0);

  if(positive.length === 0) return "Ikke fylt ut";

  return positive
    .map(row => `${row.extra_name}: ${row.extra_points} poeng`)
    .join("<br>");
}

function isSubmissionComplete(matchRows,bestPlayerRows,topScorerRows,totalMatches){
  if(matchRows.length < totalMatches) return false;

  const missingTips = matchRows.some(row =>
    isBlank(row.tips_home) || isBlank(row.tips_away)
  );

  if(missingTips) return false;

  const bestTotal = bestPlayerRows.reduce((sum,row) =>
    sum + cleanNumber(row.extra_points),0
  );

  const scorerTotal = topScorerRows.reduce((sum,row) =>
    sum + cleanNumber(row.extra_points),0
  );

  return bestTotal === 10 && scorerTotal === 25;
}

async function findTips(){
  const result = document.getElementById("result");
  const inputPhone = document.getElementById("phoneInput").value.trim();

  result.innerHTML = `<div class="card message">Laster tips...</div>`;

  if(!/^\d{8}$/.test(inputPhone)){
    result.innerHTML = `
      <div class="card message error">
        Skriv inn et gyldig telefonnummer.
      </div>
    `;
    return;
  }

  try{
    const [
      submissions,
      matches,
      results,
      registrations,
      outcomeRules,
      diffRules,
      exactRules
    ] = await Promise.all([
      fetchSheet(SUBMISSIONS_URL),
      fetchSheet(MATCHES_URL),
      fetchSheet(RESULTS_URL),
      fetchSheet(REGISTRATIONS_URL),
      fetchSheet(OUTCOME_URL),
      fetchSheet(DIFF_URL),
      fetchSheet(EXACT_URL)
    ]);

    const latestRows = getLatestRowsForPhone(submissions,inputPhone);

    if(latestRows.length === 0){
      result.innerHTML = `
        <div class="card message error">
          Fant ingen tips på dette telefonnummeret.
          <br><br>
          Sjekk nummeret, eller lever tips først.
        </div>
      `;
      return;
    }

    const matchMap = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchMap[id] = match;
    });

    const resultMap = {};
    results.forEach(row => {
      const id = String(row.id || row.match_id || "").trim();
      if(id) resultMap[id] = row;
    });

    const matchRows = latestRows.filter(row => row.type === "match");
    const bestPlayerRows = latestRows.filter(row => row.type === "bestplayer");
    const topScorerRows = latestRows.filter(row => row.type === "topscorer");

    let totalPoints = 0;
    let exactCount = 0;
    let diffCount = 0;
    let outcomeCount = 0;
    let playedCount = 0;

    const matchHtml = matchRows.map(row => {
      const matchId = String(row.match_id || row.id || "").trim();
      const match = matchMap[matchId];
      const actual = resultMap[matchId];

      const calc = calculateMatch(
        row,
        match,
        actual,
        outcomeRules,
        diffRules,
        exactRules
      );

      totalPoints += calc.points;

      if(calc.status !== "Ikke spilt") playedCount++;
      if(calc.status === "Eksakt resultat") exactCount++;
      if(calc.status === "Riktig målforskjell") diffCount++;
      if(calc.status === "Riktig utfall") outcomeCount++;

      return `
        <div class="match-card">
          <div class="match-top">
            <div>
              <div class="match-name">${getMatchLabel(match)}</div>
              <div class="match-id">Kamp ${matchId}</div>
            </div>

            <div class="score-line">
              ${isBlank(row.tips_home) || isBlank(row.tips_away)
                ? "Mangler"
                : `${row.tips_home} - ${row.tips_away}`
              }
            </div>
          </div>

          <div class="match-meta">
            <span class="pill">Resultat: ${calc.actualText}</span>
            <span class="pill ${calc.className}">${calc.status}</span>
            <span class="pill gold">${calc.points} poeng</span>
          </div>
        </div>
      `;
    }).join("");

    const complete = isSubmissionComplete(
      matchRows,
      bestPlayerRows,
      topScorerRows,
      matches.length
    );

    const statusText = complete ? "Fullført" : "Kladd/ikke fullført";
    const statusColor = complete ? "#9dffc7" : "#ffb4b4";
    const displayName = getRegisteredName(registrations,inputPhone) || "Ukjent deltaker";

    result.innerHTML = `
      <div class="card">
        <h2 class="section-title">${displayName}</h2>

        <div class="status-grid">
          <div class="status-card">
            <strong style="color:${statusColor};">${statusText}</strong>
            <span>Status</span>
          </div>

          <div class="status-card">
            <strong>${totalPoints}</strong>
            <span>Poeng hittil</span>
          </div>

          <div class="status-card">
            <strong>${playedCount}</strong>
            <span>Kamper med resultat</span>
          </div>

          <div class="status-card">
            <strong>${exactCount}</strong>
            <span>Eksakte treff</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Treff hittil</h2>

        <div class="status-grid">
          <div class="status-card">
            <strong>${exactCount}</strong>
            <span>Eksakt</span>
          </div>

          <div class="status-card">
            <strong>${diffCount}</strong>
            <span>Målforskjell</span>
          </div>

          <div class="status-card">
            <strong>${outcomeCount}</strong>
            <span>Riktig utfall</span>
          </div>

          <div class="status-card">
            <strong>${matchRows.length}</strong>
            <span>Tips levert</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Bonusvalg</h2>

        <div class="extra-grid">
          <div class="extra-card">
            <strong>Beste spiller</strong>
            <span>${renderBonusRows(bestPlayerRows)}</span>
          </div>

          <div class="extra-card">
            <strong>Toppscorer</strong>
            <span>${renderBonusRows(topScorerRows)}</span>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Kamptips</h2>
        ${matchHtml}
      </div>
    `;

  }catch(error){
    console.error(error);
    result.innerHTML = `
      <div class="card message error">
        Klarte ikke å hente tips akkurat nå.
      </div>
    `;
  }
}

document.getElementById("phoneInput").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g,"").slice(0,8);
});

document.getElementById("phoneInput").addEventListener("keydown", e => {
  if(e.key === "Enter"){
    findTips();
  }
});
</script>

</body>
</html>
