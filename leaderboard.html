<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | FC Barrios World Cup Challenge 2026</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.18), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(90deg,#0b3d24 0px,#0b3d24 80px,#0e4a2c 80px,#0e4a2c 160px);
  color:white;
  min-height:100vh;
}

.wrapper{
  max-width:1000px;
  margin:auto;
  padding:22px;
}

.hero{
  text-align:center;
  margin-bottom:22px;
}

.hero h1{
  margin:0 0 10px;
  font-size:40px;
}

.hero p{
  margin:0;
  color:rgba(255,255,255,0.7);
}

.nav{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:20px;
}

.nav a{
  color:white;
  text-decoration:none;
  padding:10px 15px;
  border-radius:999px;
  background:rgba(255,255,255,0.08);
  font-weight:bold;
}

.top-box{
  background:rgba(7,14,28,0.82);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 14px 40px rgba(0,0,0,0.35);
}

.status-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:18px;
}

.status-card{
  border-radius:18px;
  padding:16px;
  text-align:center;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
}

.status-card strong{
  display:block;
  font-size:26px;
  margin-bottom:4px;
}

.status-card span{
  color:rgba(255,255,255,0.7);
  font-size:13px;
}

.missing-box{
  display:none;
  background:rgba(255,94,94,0.10);
  border:1px solid rgba(255,94,94,0.22);
  border-radius:18px;
  padding:16px;
  margin-bottom:18px;
}

.loading{
  color:rgba(255,255,255,0.7);
  padding:12px;
}

.player-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
}

.player-grid{
  display:grid;
  grid-template-columns:52px 1fr auto;
  gap:12px;
  align-items:center;
}

.medal{
  font-size:24px;
  font-weight:bold;
}

.profile-link{
  color:white;
  text-decoration:none;
  font-size:18px;
  font-weight:bold;
}

.profile-link:hover{
  color:#ffd166;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}

.tag{
  background:rgba(255,255,255,0.08);
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
}

.points{
  font-size:32px;
  font-weight:bold;
  color:#2ecc71;
  text-align:right;
  min-width:80px;
}

.small-note{
  color:rgba(255,255,255,0.62);
  font-size:13px;
  margin-top:4px;
}

@media(max-width:700px){
  .wrapper{ padding:14px; }
  .hero h1{ font-size:30px; }

  .status-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .player-grid{
    grid-template-columns:42px 1fr;
  }

  .points{
    grid-column:1 / -1;
    text-align:left;
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="hero">
    <h1>🏆 Leaderboard</h1>
    <p>Stillingen i FC Barrios World Cup Challenge 2026</p>
  </div>

  <div class="nav">
    <a href="index.html">Forside</a>
    <a href="tips.html">Innlevering</a>
    <a href="premier.html">Premiepott</a>
  </div>

  <div class="top-box">

    <div id="statusBox" class="status-grid"></div>

    <div id="missingBox" class="missing-box"></div>

    <div id="leaderboardContainer" class="loading">
      Laster leaderboard...
    </div>

  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const REGISTRATIONS_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;
const SUBMISSIONS_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;
const MATCHES_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;
const RESULTS_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_RESULTS`;
const OUTCOME_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_OUTCOME`;
const DIFF_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_DIFF`;
const EXACT_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_EXACT`;

const BUY_IN = 600;
const FREE_ENTRIES = 1;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();

    if(!Array.isArray(data)) return [];

    return data.map(normalizeRow);
  }catch(error){
    console.error("Kunne ikke hente:", url, error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};

  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });

  return clean;
}

function cleanNumber(value){
  if(value === undefined || value === null || value === "") return 0;

  return Number(
    String(value)
      .replace(/\s/g,"")
      .replace(",",".")
  ) || 0;
}

function parseTier(value){
  if(value === undefined || value === null || value === "") return 4;
  const found = String(value).match(/[1-4]/);
  return found ? Number(found[0]) : 4;
}

function getMatchOutcome(home, away){
  home = cleanNumber(home);
  away = cleanNumber(away);

  if(home > away) return "home";
  if(away > home) return "away";
  return "draw";
}

function getTierType(match, outcome){
  if(outcome === "draw") return "draw";

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);

  if(outcome === "home"){
    return homeTier <= awayTier ? "favorite" : "underdog";
  }

  if(outcome === "away"){
    return awayTier <= homeTier ? "favorite" : "underdog";
  }

  return "draw";
}

function getRulePoint(rules, tierDiff, type){
  const row = rules.find(r => cleanNumber(r.tier_diff) === cleanNumber(tierDiff));

  if(!row) return 0;

  if(type === "favorite") return cleanNumber(row.favorite || row.favoritt);
  if(type === "draw") return cleanNumber(row.draw || row.uavgjort);
  if(type === "underdog") return cleanNumber(row.underdog || row.outsider);

  return 0;
}

function getLatestSubmissionRowsForPhone(submissions, phone){
  const rows = submissions.filter(row =>
    String(row.phone || "").trim() === String(phone || "").trim()
  );

  if(rows.length === 0) return [];

  const latestTimestamp = rows[rows.length - 1].timestamp;

  return rows.filter(row => row.timestamp === latestTimestamp);
}

function isSubmissionComplete(rows, totalMatches){
  const matchRows = rows.filter(row => row.type === "match");

  if(matchRows.length < totalMatches) return false;

  const missingTips = matchRows.some(row =>
    row.tips_home === "" ||
    row.tips_home === null ||
    row.tips_home === undefined ||
    row.tips_away === "" ||
    row.tips_away === null ||
    row.tips_away === undefined
  );

  if(missingTips) return false;

  const bestPlayerPoints = rows
    .filter(row => row.type === "bestplayer")
    .reduce((sum,row) => sum + cleanNumber(row.extra_points),0);

  const topScorerPoints = rows
    .filter(row => row.type === "topscorer")
    .reduce((sum,row) => sum + cleanNumber(row.extra_points),0);

  return bestPlayerPoints === 10 && topScorerPoints === 10;
}

function calculateScore(rows, matchesById, resultsById, outcomeRules, diffRules, exactRules){
  let points = 0;
  let exact = 0;
  let outcome = 0;
  let diff = 0;
  let underdog = 0;

  const matchRows = rows.filter(row => row.type === "match");

  matchRows.forEach(tip => {
    const matchId = String(tip.match_id || tip.id || "").trim();
    const match = matchesById[matchId];
    const result = resultsById[matchId];

    if(!match || !result) return;

    if(
  result.actual_home === undefined ||
  result.actual_home === null ||
  result.actual_home === "" ||
  result.actual_away === undefined ||
  result.actual_away === null ||
  result.actual_away === ""
){
  return;
}

    const tipHome = cleanNumber(tip.tips_home);
    const tipAway = cleanNumber(tip.tips_away);
    const actualHome = cleanNumber(result.actual_home);
    const actualAway = cleanNumber(result.actual_away);

    const tipOutcome = getMatchOutcome(tipHome, tipAway);
    const actualOutcome = getMatchOutcome(actualHome, actualAway);

    const tipDiff = tipHome - tipAway;
    const actualDiff = actualHome - actualAway;

    const homeTier = parseTier(match.tier_home);
    const awayTier = parseTier(match.tier_away);
    const tierDiff = Math.abs(homeTier - awayTier);
    const tierType = getTierType(match, tipOutcome);

    let added = 0;

    if(tipHome === actualHome && tipAway === actualAway){
      added = getRulePoint(exactRules, tierDiff, tierType);
      exact++;
    }else if(tipDiff === actualDiff){
      added = getRulePoint(diffRules, tierDiff, tierType);
      diff++;
    }else if(tipOutcome === actualOutcome){
      added = getRulePoint(outcomeRules, tierDiff, tierType);
      outcome++;
    }

    if(added > 0 && tierType === "underdog"){
      underdog++;
    }

    points += added;
  });

  return { points, exact, outcome, diff, underdog };
}

function getMedal(index){
  if(index === 0) return "🥇";
  if(index === 1) return "🥈";
  if(index === 2) return "🥉";
  return `${index + 1}.`;
}

async function loadLeaderboard(){
  const container = document.getElementById("leaderboardContainer");
  const statusBox = document.getElementById("statusBox");
  const missingBox = document.getElementById("missingBox");

  try{
    const [
      registrations,
      submissions,
      matches,
      results,
      outcomeRules,
      diffRules,
      exactRules
    ] = await Promise.all([
      fetchSheet(REGISTRATIONS_API_URL),
      fetchSheet(SUBMISSIONS_API_URL),
      fetchSheet(MATCHES_API_URL),
      fetchSheet(RESULTS_API_URL),
      fetchSheet(OUTCOME_API_URL),
      fetchSheet(DIFF_API_URL),
      fetchSheet(EXACT_API_URL)
    ]);

    const matchesById = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchesById[id] = match;
    });

    const resultsById = {};
    results.forEach(result => {
      const id = String(result.id || result.match_id || "").trim();
      if(id) resultsById[id] = result;
    });

    const uniqueMap = new Map();

    registrations.forEach(row => {
      const phone = String(row.phone || "").trim();

      if(!phone) return;

      if(!uniqueMap.has(phone)){
        uniqueMap.set(phone,{
          name:
            row.full_name ||
            row["full name"] ||
            `${row.first_name || row["first name"] || ""} ${row.last_name || row["last name"] || ""}`.trim(),
          phone
        });
      }
    });

    const players = [...uniqueMap.values()]
      .filter(player => player.name);

    const completedPhones = new Set();

    const rows = players.map(player => {
      const latestRows = getLatestSubmissionRowsForPhone(submissions, player.phone);
      const complete = isSubmissionComplete(latestRows, matches.length);

      if(complete){
        completedPhones.add(player.phone);
      }

      const score = calculateScore(
        latestRows,
        matchesById,
        resultsById,
        outcomeRules,
        diffRules,
        exactRules
      );

      return {
        ...player,
        ...score,
        complete
      };
    }).sort((a,b) =>
      cleanNumber(b.points) - cleanNumber(a.points) ||
      cleanNumber(b.exact) - cleanNumber(a.exact) ||
      a.name.localeCompare(b.name,"no")
    );

    const registeredCount = rows.length;
    const completedCount = rows.filter(row => row.complete).length;
    const missingNames = rows
      .filter(row => !row.complete)
      .map(row => row.name);

    const missingCount = Math.max(0, registeredCount - completedCount);
    const paidPlayers = Math.max(0, registeredCount - FREE_ENTRIES);
    const prizePool = paidPlayers * BUY_IN;

    statusBox.innerHTML = `
      <div class="status-card">
        <strong>${registeredCount}</strong>
        <span>Registrerte</span>
      </div>

      <div class="status-card">
        <strong>${paidPlayers}</strong>
        <span>Betalte plasser</span>
      </div>

      <div class="status-card" style="background:rgba(255,209,102,0.12);border-color:rgba(255,209,102,0.25);">
        <strong style="color:#ffd166;">${prizePool.toLocaleString("no-NO")} kr</strong>
        <span>Premiepott</span>
      </div>

      <div class="status-card" style="background:rgba(46,204,113,0.14);border-color:rgba(46,204,113,0.25);">
        <strong style="color:#9dffc7;">${completedCount}</strong>
        <span>Fullført tips</span>
      </div>

      <div class="status-card" style="background:rgba(255,94,94,0.12);border-color:rgba(255,94,94,0.22);">
        <strong style="color:#ffb4b4;">${missingCount}</strong>
        <span>Mangler tips</span>
      </div>
    `;

    if(missingNames.length > 0){
      missingBox.style.display = "block";
      missingBox.innerHTML = `
        <strong style="color:#ffb4b4;">Mangler fullført tips:</strong>
        <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:8px;">
          ${missingNames.map(name => `
            <span style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.10);border-radius:999px;padding:6px 10px;font-size:13px;">
              ${name}
            </span>
          `).join("")}
        </div>
      `;
    }else{
      missingBox.style.display = "none";
    }

    if(rows.length === 0){
      container.innerHTML = `<div style="color:rgba(255,255,255,0.7);">Ingen registrerte deltakere ennå.</div>`;
      return;
    }

    container.innerHTML = "";

    rows.forEach((row,index) => {
      container.innerHTML += `
        <div class="player-card">
          <div class="player-grid">
            <div class="medal">${getMedal(index)}</div>

            <div>
              <a class="profile-link" href="profil.html?name=${encodeURIComponent(row.name)}">
                ${row.name}
              </a>

              <div class="small-note">
                ${row.complete ? "Tips levert" : "Ikke fullført tips"}
              </div>

              <div class="tags">
                <div class="tag">🎯 ${cleanNumber(row.exact)} eksakte</div>
                <div class="tag">⚽ ${cleanNumber(row.outcome)} riktige utfall</div>
                <div class="tag">📏 ${cleanNumber(row.diff)} diff</div>
                <div class="tag">🔥 ${cleanNumber(row.underdog)} outsider</div>
              </div>
            </div>

            <div class="points">${cleanNumber(row.points)}</div>
          </div>
        </div>
      `;
    });

  }catch(error){
    container.innerHTML = `<div style="color:#ff8080;">Klarte ikke å laste leaderboard.</div>`;
    console.error(error);
  }
}

loadLeaderboard();
setInterval(loadLeaderboard, 30000);
</script>

</body>
</html>
