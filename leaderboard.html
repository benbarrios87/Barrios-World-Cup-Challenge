<script>

function cleanNumber(value){
  return Number(
    String(value || "0")
      .replace(/\s/g, "")
      .replace(",", ".")
  ) || 0;
}

async function loadLeaderboard(){

  const container = document.getElementById("leaderboardContainer");

  try{

    const data = await fetchSheet(LEADERBOARD_API_URL);

    const rows = data
      .filter(row => row.name)
      .sort((a,b) => cleanNumber(b.points) - cleanNumber(a.points));

    if(rows.length === 0){
      container.innerHTML = `
        <div style="color:rgba(255,255,255,0.7);">
          Ingen poeng ennå.
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div style="
        display:grid;
        grid-template-columns:50px 1fr 80px;
        gap:10px;
        padding:0 0 10px;
        font-weight:bold;
        color:rgba(255,255,255,0.65);
        border-bottom:1px solid rgba(255,255,255,0.1);
        margin-bottom:10px;
      ">
        <div>#</div>
        <div>Spiller</div>
        <div style="text-align:right;">Poeng</div>
      </div>
    `;

    rows.forEach((row,index) => {

      const medal =
        index === 0 ? "🥇" :
        index === 1 ? "🥈" :
        index === 2 ? "🥉" :
        `${index + 1}`;

      container.innerHTML += `
        <div style="
          padding:14px;
          border-radius:16px;
          background:rgba(255,255,255,0.06);
          border:1px solid rgba(255,255,255,0.08);
          margin-bottom:12px;
        ">

          <div style="
            display:grid;
            grid-template-columns:50px 1fr 80px;
            gap:10px;
            align-items:center;
          ">

            <div style="
              font-size:22px;
              font-weight:bold;
            ">
              ${medal}
            </div>

            <div>

              <div style="
                font-size:18px;
                font-weight:bold;
              ">
                ${row.name}
              </div>

              <div style="
                margin-top:5px;
                display:flex;
                flex-wrap:wrap;
                gap:6px;
              ">

                <div style="
                  padding:5px 9px;
                  border-radius:999px;
                  background:rgba(255,255,255,0.08);
                  font-size:12px;
                ">
                  🎯 ${cleanNumber(row.exact)} eksakte
                </div>

                <div style="
                  padding:5px 9px;
                  border-radius:999px;
                  background:rgba(255,255,255,0.08);
                  font-size:12px;
                ">
                  ⚽ ${cleanNumber(row.outcome)} riktige
                </div>

                <div style="
                  padding:5px 9px;
                  border-radius:999px;
                  background:rgba(255,255,255,0.08);
                  font-size:12px;
                ">
                  🔥 ${cleanNumber(row.underdog)} outsiderpoeng
                </div>

              </div>
            </div>

            <div style="
              text-align:right;
              font-size:28px;
              font-weight:bold;
              color:#2ecc71;
            ">
              ${cleanNumber(row.points)}
            </div>

          </div>

        </div>
      `;
    });

  }catch(error){

    container.innerHTML = `
      <div style="color:#ff8080;">
        Klarte ikke å laste leaderboard.
      </div>
    `;

    console.error(error);
  }
}

</script>
