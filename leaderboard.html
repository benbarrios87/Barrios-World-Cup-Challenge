<script>

const SHEET_ID = "1EvB5oqS4Bemr_W8VXYzWAVsr4nX0u3VTQMpgUlOM9-s";

const LEADERBOARD_API_URL =
`https://opensheet.elk.sh/${SHEET_ID}/API_LEADERBOARD`;

async function fetchSheet(url){
  const response = await fetch(url);
  return await response.json();
}

function cleanNumber(value){

  if(value === undefined || value === null || value === ""){
    return 0;
  }

  return Number(
    String(value)
      .replace(/\s/g,"")
      .replace(",",".")
  ) || 0;
}

async function loadLeaderboard(){

  const container =
    document.getElementById("leaderboardContainer");

  if(!container) return;

  try{

    const data = await fetchSheet(LEADERBOARD_API_URL);

    const rows = data
      .filter(row => row.name)
      .sort((a,b) =>
        cleanNumber(b.points) - cleanNumber(a.points)
      );

    if(rows.length === 0){

      container.innerHTML = `
        <div style="
          color:rgba(255,255,255,0.7);
          padding:12px;
        ">
          Ingen poeng ennå.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    rows.forEach((row,index) => {

      const medal =
        index === 0 ? "🥇" :
        index === 1 ? "🥈" :
        index === 2 ? "🥉" :
        `${index + 1}.`;

      container.innerHTML += `

        <div style="
          background:rgba(255,255,255,0.06);
          border:1px solid rgba(255,255,255,0.1);
          border-radius:18px;
          padding:16px;
          margin-bottom:14px;
        ">

          <div style="
            display:grid;
            grid-template-columns:48px 1fr auto;
            gap:12px;
            align-items:center;
          ">

            <div style="
              font-size:24px;
              font-weight:bold;
            ">
              ${medal}
            </div>

            <div>

              <div style="
                font-size:18px;
                font-weight:bold;
                margin-bottom:8px;
              ">
                ${row.name}
              </div>

              <div style="
                display:flex;
                flex-wrap:wrap;
                gap:8px;
              ">

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  🎯 ${cleanNumber(row.exact)} eksakte
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  ⚽ ${cleanNumber(row.outcome)} riktige
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  📏 ${cleanNumber(row.diff)} diff
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  🔥 ${cleanNumber(row.underdog)} outsider
                </div>

              </div>

            </div>

            <div style="
              font-size:30px;
              font-weight:bold;
              color:#2ecc71;
              text-align:right;
              min-width:70px;
            ">
              ${cleanNumber(row.points)}
            </div>

          </div>

        </div>
      `;
    });

  }catch(error){

    container.innerHTML = `
      <div style="
        color:#ff8080;
        padding:12px;
      ">
        Klarte ikke å laste leaderboard.
      </div>
    `;

    console.error(error);
  }
}

loadLeaderboard();

</script>
