<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VM Leaderboard</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.18), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(
      90deg,
      #0b3d24 0px,
      #0b3d24 80px,
      #0e4a2c 80px,
      #0e4a2c 160px
    );
  color:white;
  min-height:100vh;
}

.wrapper{
  max-width:900px;
  margin:auto;
  padding:22px;
}

.hero{
  text-align:center;
  margin-bottom:26px;
}

.hero h1{
  margin:0 0 10px;
  font-size:40px;
}

.hero p{
  margin:0;
  color:rgba(255,255,255,0.7);
}

.top-box{
  background:rgba(7,14,28,0.82);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:20px;
  backdrop-filter:blur(10px);
  box-shadow:0 14px 40px rgba(0,0,0,0.35);
}

.loading{
  color:rgba(255,255,255,0.7);
  padding:12px;
}

@media(max-width:700px){

  .wrapper{
    padding:14px;
  }

  .hero h1{
    font-size:30px;
  }

}

</style>
</head>

<body>

<div class="wrapper">

  <div class="hero">
    <h1>🏆 VM Leaderboard</h1>
    <p>Stillingen i Barrios World Cup Challenge 2026</p>
  </div>

 <div class="top-box">

  <div id="statusBox" style="
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
  "></div>

  <div id="leaderboardContainer" class="loading">
      Laster leaderboard...
    </div>

  </div>

</div>

<script>

const SHEET_ID =
"1EvB5oqS4Bemr_W8VXYzWAVsr4nX0u3VTQMpgUlOM9-s";

const LEADERBOARD_API_URL =
`https://opensheet.elk.sh/${SHEET_ID}/API_LEADERBOARD`;
  const SUBMISSIONS_API_URL =
`https://opensheet.elk.sh/${SHEET_ID}/SUBMISSIONS`;

async function fetchSheet(url){

  const response = await fetch(url);

  return await response.json();
}

function cleanNumber(value){

  if(value === undefined || value === null || value === ""){
    return 0;
  }

  return Number(
    String(value)
      .replace(/\s/g,"")
      .replace(",",".")
  ) || 0;
}
function isSubmissionComplete(sub){

  try{

    const tips =
      JSON.parse(sub.tips_json || "[]");

    const bestPlayer =
      JSON.parse(sub.best_player_json || "[]");

    const topScorer =
      JSON.parse(sub.top_scorer_json || "[]");

    if(!tips.length) return false;

    const missingTips = tips.some(t =>
      t.tips_home === "" ||
      t.tips_home === null ||
      t.tips_home === undefined ||
      t.tips_away === "" ||
      t.tips_away === null ||
      t.tips_away === undefined
    );

    if(missingTips) return false;

    if(!bestPlayer.length) return false;
    if(!topScorer.length) return false;

    return true;

  }catch(err){

    return false;

  }

}
  
async function loadLeaderboard(){

  const container =
    document.getElementById("leaderboardContainer");

  try{

    const data = await fetchSheet(LEADERBOARD_API_URL);

const submissions =
  await fetchSheet(SUBMISSIONS_API_URL);

    const rows = data
      .filter(row => row.name)
      .sort((a,b) =>
        cleanNumber(b.points) - cleanNumber(a.points)
      );
const registeredCount = rows.length;

const completedNames = new Set(
  submissions
    .filter(isSubmissionComplete)
    .map(sub => String(sub.name || "").trim().toLowerCase())
);

const completedCount = rows.filter(row =>
  completedNames.has(String(row.name || "").trim().toLowerCase())
).length;

const missingCount =
  Math.max(0, registeredCount - completedCount);

document.getElementById("statusBox").innerHTML = `

  <div style="
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:18px;
    padding:16px;
    text-align:center;
  ">
    <div style="
      font-size:28px;
      font-weight:bold;
    ">
      ${registeredCount}
    </div>

    <div style="
      color:rgba(255,255,255,0.7);
      font-size:13px;
      margin-top:4px;
    ">
      Registrerte
    </div>
  </div>

  <div style="
    background:rgba(46,204,113,0.14);
    border:1px solid rgba(46,204,113,0.25);
    border-radius:18px;
    padding:16px;
    text-align:center;
  ">
    <div style="
      font-size:28px;
      font-weight:bold;
      color:#9dffc7;
    ">
      ${completedCount}
    </div>

    <div style="
      color:rgba(255,255,255,0.7);
      font-size:13px;
      margin-top:4px;
    ">
      Fullført tips
    </div>
  </div>

  <div style="
    background:rgba(255,94,94,0.12);
    border:1px solid rgba(255,94,94,0.22);
    border-radius:18px;
    padding:16px;
    text-align:center;
  ">
    <div style="
      font-size:28px;
      font-weight:bold;
      color:#ffb4b4;
    ">
      ${missingCount}
    </div>

    <div style="
      color:rgba(255,255,255,0.7);
      font-size:13px;
      margin-top:4px;
    ">
      Mangler tips
    </div>
  </div>

`;
    
    if(rows.length === 0){

      container.innerHTML = `
        <div style="
          color:rgba(255,255,255,0.7);
        ">
          Ingen poeng ennå.
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    rows.forEach((row,index) => {

      const medal =
        index === 0 ? "🥇" :
        index === 1 ? "🥈" :
        index === 2 ? "🥉" :
        `${index + 1}.`;

      container.innerHTML += `

        <div style="
          background:rgba(255,255,255,0.06);
          border:1px solid rgba(255,255,255,0.1);
          border-radius:18px;
          padding:16px;
          margin-bottom:14px;
        ">

          <div style="
            display:grid;
            grid-template-columns:48px 1fr auto;
            gap:12px;
            align-items:center;
          ">

            <div style="
              font-size:24px;
              font-weight:bold;
            ">
              ${medal}
            </div>

            <div>

              <div style="
                font-size:18px;
                font-weight:bold;
                margin-bottom:8px;
              ">
                ${row.name}
              </div>

              <div style="
                display:flex;
                flex-wrap:wrap;
                gap:8px;
              ">

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  🎯 ${cleanNumber(row.exact)} eksakte
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  ⚽ ${cleanNumber(row.outcome)} riktige
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  📏 ${cleanNumber(row.diff)} diff
                </div>

                <div style="
                  background:rgba(255,255,255,0.08);
                  padding:5px 10px;
                  border-radius:999px;
                  font-size:12px;
                ">
                  🔥 ${cleanNumber(row.underdog)} outsider
                </div>

              </div>

            </div>

            <div style="
              font-size:30px;
              font-weight:bold;
              color:#2ecc71;
              text-align:right;
              min-width:70px;
            ">
              ${cleanNumber(row.points)}
            </div>

          </div>

        </div>

      `;
    });

  }catch(error){

    container.innerHTML = `
      <div style="color:#ff8080;">
        Klarte ikke å laste leaderboard.
      </div>
    `;

    console.error(error);
  }
}

loadLeaderboard();

</script>

</body>
</html>
