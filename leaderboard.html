<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const PROFILE_CACHE_API_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_PROFILE_CACHE`;

const BUY_IN = 600;
const FREE_ENTRIES = 1;

async function fetchSheet(url){
  try{
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);

    const response = await fetch(url, {
      cache:"no-store",
      signal: controller.signal
    });

    clearTimeout(timeout);

    const data = await response.json();

    if(!Array.isArray(data)){
      console.error("Ikke array:", data);
      return [];
    }

    return data.map(normalizeRow);
  }catch(error){
    console.error("Kunne ikke hente:", url, error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};

  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });

  return clean;
}

function cleanNumber(value){
  if(value === undefined || value === null || value === "") return 0;

  return Number(
    String(value)
      .replace(/\s/g,"")
      .replace(",",".")
  ) || 0;
}

function getPrizeForPlace(index, prizePool){
 const prizes = [
  { label:"1. premie", percent:0.40 },
  { label:"2. premie", percent:0.24 },
  { label:"3. premie", percent:0.16 },
  { label:"4. premie", percent:0.12 },
  { label:"5. premie", percent:0.08 }
];

  const prize = prizes[index];
  if(!prize) return "";

  const amount = Math.round(prizePool * prize.percent);

  return `
    <div class="tag prize-tag">
      💰 ${prize.label}: ${amount.toLocaleString("no-NO")} kr
    </div>
  `;
}

function getMedal(index){
  if(index === 0) return "🥇";
  if(index === 1) return "🥈";
  if(index === 2) return "🥉";
  return `${index + 1}.`;
}

function getInitials(name){
  return String(name || "")
    .split(" ")
    .map(part => part[0] || "")
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function slugify(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/æ/g,"ae")
    .replace(/ø/g,"o")
    .replace(/å/g,"a")
    .replace(/[^a-z0-9]/g,"");
}

function getAvatarFile(name){

  const first =
    slugify(
      String(name || "")
        .trim()
        .split(/\s+/)[0]
    );

  const full = slugify(name);

  const lower = String(name || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

  if(
    lower.includes("anders") &&
    (
      lower.includes("uldalen") ||
      lower.includes("uldalden") ||
      lower.includes("brosstad") ||
      lower.includes("brosstand")
    )
  ){
    return "andersub.png";
  }

  const specialFiles = {
    "kristoffereckhoff":"kristoffereckhoff.png",
    "kristoffermerker":"kristoffermerker.png",
    "kristofferlongva":"kristofferlongva.png",
    "kristofferrunestad":"kristofferrunestad.png",
    "andreasstraete":"andreasstraete.png"
  };

  if(specialFiles[full]){
    return specialFiles[full];
  }

  return `${first}.png`;
}

function handleAvatarError(img, name){
  const initials = getInitials(name);
  img.outerHTML = `<div class="avatar-fallback">${initials}</div>`;
}

function renderBonusTags(row){
  const tags = [];

  if(row.top_scorer){
    tags.push(`<div class="tag">⚽ ${row.top_scorer} +${cleanNumber(row.top_scorer_points)}</div>`);
  }

  if(row.best_player){
    tags.push(`<div class="tag">⭐ ${row.best_player} +${cleanNumber(row.best_player_points)}</div>`);
  }

  return tags.join("");
}
function shortMatch(match){

  return String(match || "")
    .split(" - ")
    .map(team => team.trim().substring(0,3).toUpperCase())
    .join("-");
}

function renderNextTips(row){

  const tips = [];

  if(row.next_1_match && row.next_1_tip){
    tips.push(
      `${shortMatch(row.next_1_match)} ${row.next_1_tip}`
    );
  }

  if(row.next_2_match && row.next_2_tip){
    tips.push(
      `${shortMatch(row.next_2_match)} ${row.next_2_tip}`
    );
  }

  if(row.next_3_match && row.next_3_tip){
    tips.push(
      `${shortMatch(row.next_3_match)} ${row.next_3_tip}`
    );
  }

  if(row.next_4_match && row.next_4_tip){
    tips.push(
      `${shortMatch(row.next_4_match)} ${row.next_4_tip}`
    );
  }

  if(tips.length === 0) return "";

  return `
    <div class="next-tips">
      🎯 ${tips.join(" • ")}
    </div>
  `;
}
async function loadLeaderboard(){
  const container = document.getElementById("leaderboardContainer");
  const statusBox = document.getElementById("statusBox");
  const missingBox = document.getElementById("missingBox");

  try{
    const rows = await fetchSheet(PROFILE_CACHE_API_URL);

    rows.sort((a,b) =>
      cleanNumber(a.rank) - cleanNumber(b.rank) ||
      cleanNumber(b.points) - cleanNumber(a.points) ||
      String(a.name || "").localeCompare(String(b.name || ""),"no")
    );

    const registeredCount = rows.length;
    const paidPlayers = Math.max(0, registeredCount - FREE_ENTRIES);
    const prizePool = paidPlayers * BUY_IN;
    const playedCount = Math.max(0, ...rows.map(row => cleanNumber(row.played)));
    const totalExact = rows.reduce((sum,row) => sum + cleanNumber(row.exact),0);
    const leaderPoints = rows[0] ? cleanNumber(rows[0].points) : 0;

    statusBox.innerHTML = `
      <div class="status-card">
        <strong>${registeredCount}</strong>
        <span>Deltakere</span>
      </div>

      <div class="status-card">
        <strong>${playedCount}</strong>
        <span>Kamper spilt</span>
      </div>

      <div class="status-card" style="background:rgba(255,209,102,0.12);border-color:rgba(255,209,102,0.25);">
        <strong style="color:#ffd166;">${prizePool.toLocaleString("no-NO")} kr</strong>
        <span>Premiepott</span>
      </div>

      <div class="status-card" style="background:rgba(46,204,113,0.14);border-color:rgba(46,204,113,0.25);">
        <strong style="color:#9dffc7;">${leaderPoints}</strong>
        <span>Lederpoeng</span>
      </div>

      <div class="status-card">
        <strong>${totalExact}</strong>
        <span>Eksakte treff totalt</span>
      </div>
    `;

    missingBox.style.display = "none";

    if(rows.length === 0){
      container.innerHTML = `<div style="color:rgba(255,255,255,0.7);">Kunne ikke laste leaderboard akkurat nå. Prøv å oppdatere siden.</div>`;
      return;
    }

    container.innerHTML = "";

    rows.forEach((row,index) => {
      container.innerHTML += `
        <div class="player-card ${index < 5 ? `top-${index + 1}` : ""}">
          <div class="player-grid">
            <div class="medal">${getMedal(index)}</div>

            <img
              class="mini-avatar"
              src="${getAvatarFile(row.name)}"
              alt="${row.name}"
              onerror="handleAvatarError(this,'${String(row.name || "").replace(/'/g,"&#39;")}')"
            >

            <div>
              <a class="profile-link" href="profil.html?name=${encodeURIComponent(row.name)}">
                ${row.name}
              </a>

              <div class="small-note">
                Rank ${cleanNumber(row.rank)} av ${registeredCount}
              </div>

              <div class="tags">
                ${getPrizeForPlace(index, prizePool)}
                <div class="tag">🎯 ${cleanNumber(row.exact)} eksakte</div>
                <div class="tag">⚽ ${cleanNumber(row.outcome)} riktige utfall</div>
                <div class="tag">📏 ${cleanNumber(row.diff)} målforskjell </div>
                <div class="tag">🔥 ${cleanNumber(row.underdog)} Modige treff (poeng til underdog) </div>
                ${renderBonusTags(row)}
              </div>
              ${renderNextTips(row)}
            </div>

            <div class="points">
              ${cleanNumber(row.points)}
              <span>poeng</span>
            </div>
          </div>
        </div>
      `;
    });

    document.getElementById("lastUpdated").textContent =
      "Sist oppdatert fra databasen: " +
      new Date().toLocaleTimeString("no-NO",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      });
  }catch(error){
    container.innerHTML = `<div style="color:#ff8080;">Klarte ikke å laste leaderboard fra API_PROFILE_CACHE.</div>`;
    console.error(error);
  }
}

loadLeaderboard();
setInterval(loadLeaderboard, 60000);
</script>
