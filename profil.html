async function fetchSheet(url){try{const r=await fetch(url,{cache:"no-store"});const d=await r.json();if(!Array.isArray(d))return[];return d.map(normalizeRow)}catch(e){console.error(e);return[]}}
function normalizeRow(row){const clean={};Object.keys(row||{}).forEach(key=>{const cleanKey=String(key).trim().toLowerCase().replace(/\s+/g,"_").replace(/-/g,"_");clean[cleanKey]=typeof row[key]==="string"?row[key].trim():row[key]});return clean}
function cleanNumber(value){if(value===undefined||value===null||value==="")return 0;return Number(String(value).replace(/\s/g,"").replace(",","."))||0}
function prettyPoints(value){const n=cleanNumber(value);if(Number.isInteger(n))return String(n);return n.toFixed(1).replace(/\.0$/,'')}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function toRating(value,maxValue){if(maxValue<=0)return 75;return clamp(Math.round(75+(value/maxValue)*24),75,99)}
function getQueryName(){return new URLSearchParams(window.location.search).get("name")||""}
function getInitials(name){return String(name||"").split(" ").map(p=>p[0]||"").join("").slice(0,2).toUpperCase()}
function slugify(value){return String(value||"").trim().toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"")}
function firstNameSlug(name){return slugify(String(name||"").trim().split(/\s+/)[0]||"default")}
function fullNameSlug(name){return slugify(name||"default")}
function getPhotoCandidates(name,allRows){const first=firstNameSlug(name),full=fullNameSlug(name);const sameFirstCount=allRows.filter(row=>firstNameSlug(row.name)===first).length;const candidates=[];if(sameFirstCount>1)candidates.push(`${full}.png`);candidates.push(`${first}.png`);if(first==="anders"&&(full.includes("uldalen")||full.includes("uldalden")||full.includes("brosstad")||full.includes("brosstand")))candidates.unshift("andersub.png");return[...new Set(candidates)]}
function setPhotoWithFallback(img,name,allRows){const candidates=getPhotoCandidates(name,allRows);img.dataset.candidates=JSON.stringify(candidates);img.dataset.index="0";img.src=candidates[0]||"default.png"}
function handlePhotoError(img,initials){let candidates=[];try{candidates=JSON.parse(img.dataset.candidates||"[]")}catch(e){}let index=Number(img.dataset.index||0)+1;if(index<candidates.length){img.dataset.index=String(index);img.src=candidates[index];return}const wrap=img.parentElement;if(wrap)wrap.innerHTML=`<div class="photo-fallback">${initials}</div>`}
function getShortNameParts(name){const parts=String(name||"").trim().split(/\s+/);if(parts.length<=1)return[parts[0]||""];return[parts[0],parts[parts.length-1]]}
function splitBonus(names,points){const nameArr=String(names||"").split("|").map(i=>i.trim()).filter(Boolean);const pointArr=String(points||"").split("|").map(i=>i.trim());return nameArr.map((name,index)=>({name,points:cleanNumber(pointArr[index])}))}
function renderBonusChoice(title,icon,names,points){const items=splitBonus(names,points);if(items.length===0)return`<div class="bonus-choice"><div class="label">${icon} ${title}</div><div class="note">Ikke fylt ut</div></div>`;return`<div class="bonus-choice"><div class="label">${icon} ${title}</div><div class="compact-bonus-list">${items.map(item=>`<span class="compact-bonus-pill">${item.name} <strong>+${prettyPoints(item.points)}</strong></span>`).join("")}</div></div>`}
function renderRtgChoice(player){const picks=String(player.rtg_picks||"").split("|").map(i=>i.trim()).filter(Boolean);const rtgPoints=cleanNumber(player.rtg_points);const alive=String(player.rtg_alive||"").toLowerCase()==="true";if(picks.length===0&&rtgPoints===0&&!alive)return"";return`<div class="bonus-choice" style="grid-column:1 / -1;"><div class="label">🧨 Road to Glory</div><div class="compact-bonus-list">${picks.map(item=>`<span class="compact-bonus-pill rtg-pill">${item}</span>`).join("")}<span class="compact-bonus-pill rtg-pill">RTG-poeng <strong>+${prettyPoints(rtgPoints)}</strong></span>${alive?`<span class="compact-bonus-pill rtg-pill">🟢 Lever fortsatt</span>`:""}</div></div>`}
function getRatings(player,allRows){const maxPoints=Math.max(...allRows.map(row=>cleanNumber(row.points)),1),maxExact=Math.max(...allRows.map(row=>cleanNumber(row.exact)),1),maxUnderdog=Math.max(...allRows.map(row=>cleanNumber(row.underdog)),1),maxDiff=Math.max(...allRows.map(row=>cleanNumber(row.diff)),1),maxOutcome=Math.max(...allRows.map(row=>cleanNumber(row.outcome)),1);const tip=toRating(cleanNumber(player.exact)+cleanNumber(player.diff)*.6,maxExact+maxDiff*.6),out=toRating(cleanNumber(player.underdog),maxUnderdog),res=toRating(cleanNumber(player.points),maxPoints),luk=toRating(cleanNumber(player.diff)+cleanNumber(player.outcome)*.25,maxDiff+maxOutcome*.25),ovr=Math.round((tip+out+res+luk)/4);return{tip,out,res,luk,ovr}}

function normalizeNameKey(value){return slugify(value||"")}
function getHistoryAliases(name){const aliases={"benjaminbarrios":["Benjamin"],"kristoffermerker":["Merker","Basse","Kristoffer"],"kristoffereckhoff":["Kristoffer E.","Kristoffer E"],"mattiasandersson":["Mattias"],"larsharaldsen":["Lars H","Lars"],"andreasstraete":["Andreas"],"orjanknutsen":["Ørjan","Orjan"],"jannikberg":["Jannik"],"edwardeikland":["Edward"],"mariusmartinsen":["Marius"],"martinhildonenmarum":["Martin Marum","Martin"],"andersuldalenbrosstad":["Anders UB","Anders Ub","Anders U.B.","Anders U.B"],"andersulvestad":["andersbergulvestad":["Anders Ulv","Anders U. og Ingrid Helene"], ""oyvindrefsnes":["Øyvind","Øyvind R.","Øyvind R"],"oleandreas":["Ole"],"frederikskoe":["Frederik"],"silvia":["Silvia"],"eirik":["Eirik"]};const key=normalizeNameKey(name);return[name,...(aliases[key]||[])].map(normalizeNameKey)}
function getHistoryAliases(name){const aliases={"benjaminbarrios":["Benjamin"],"kristoffermerker":["Merker","Basse","Kristoffer"],"kristoffereckhoff":["Kristoffer E.","Kristoffer E"],"mattiasandersson":["Mattias"],"larsharaldsen":["Lars H","Lars"],"andreasstraete":["Andreas"],"orjanknutsen":["Ørjan","Orjan"],"jannikberg":["Jannik"],"edwardeikland":["Edward"],"mariusmartinsen":["Marius"],"martinhildonenmarum":["Martin Marum","Martin"],"andersuldalenbrosstad":["Anders UB","Anders Ub","Anders U.B.","Anders U.B"],"andersulvestad":["andersbergulvestad":["Anders Ulv","Anders U. og Ingrid Helene"], ""oyvindrefsnes":["Øyvind","Øyvind R.","Øyvind R"],"oleandreas":["Ole"],"frederikskoe":["Frederik"],"silvia":["Silvia"],"eirik":["Eirik"]};const key=normalizeNameKey(name);return[name,...(aliases[key]||[])].map(normalizeNameKey)}
function getPlayerHistory(historyRows,playerName){const keys=new Set(getHistoryAliases(playerName));return historyRows.filter(row=>keys.has(normalizeNameKey(row.name))).sort((a,b)=>cleanNumber(a.year)-cleanNumber(b.year))}
function getCareerStats(historyRows){const tournaments=historyRows.length,ranks=historyRows.map(row=>cleanNumber(row.rank)).filter(Boolean),bestRank=ranks.length?Math.min(...ranks):0,avgRank=ranks.length?(ranks.reduce((s,v)=>s+v,0)/ranks.length).toFixed(1).replace(".",","):"-",gold=historyRows.filter(row=>cleanNumber(row.rank)===1).length,silver=historyRows.filter(row=>cleanNumber(row.rank)===2).length,bronze=historyRows.filter(row=>cleanNumber(row.rank)===3).length,podiums=gold+silver+bronze,firstYear=historyRows.length?cleanNumber(historyRows[0].year):"";return{tournaments,bestRank,avgRank,gold,silver,bronze,podiums,firstYear}}
function renderCardCareerBadges(careerStats){if(!careerStats||careerStats.tournaments===0)return"";const badges=[];if(careerStats.gold>0)badges.push(`🏆 ${careerStats.gold}x mester`);if(careerStats.podiums>0)badges.push(`🎖 ${careerStats.podiums} podier`);badges.push(`📜 ${careerStats.tournaments} mesterskap`);if(careerStats.firstYear)badges.push(`Siden ${careerStats.firstYear}`);return`<div class="card-career-badges">${badges.slice(0,3).map(badge=>`<span class="card-career-badge">${badge}</span>`).join("")}</div>`}

function renderCareerPanel(historyRows,player,allRows){const playerHistory=getPlayerHistory(historyRows,player.name),careerStats=getCareerStats(playerHistory);if(playerHistory.length===0)return`<div class="panel"><h2 class="section-title">🏛 FC Barrios-karriere</h2><div class="note">Ingen historiske mesterskap koblet til denne spilleren ennå.</div></div>`;return`<div class="panel"><h2 class="section-title">🏛 FC Barrios-karriere</h2><div class="career-hero"><div class="career-main-card"><div class="career-main-label">Historisk profil</div><div class="career-main-title">${careerStats.tournaments} mesterskap</div><div class="career-main-sub">Debut ${careerStats.firstYear||"-"} · Beste plassering ${careerStats.bestRank?"#"+careerStats.bestRank:"-"} · Snitt ${careerStats.avgRank}</div></div><div class="trophy-shelf"><div class="trophy-box"><strong>🥇 ${careerStats.gold}</strong><span>gull</span></div><div class="trophy-box"><strong>🥈 ${careerStats.silver}</strong><span>sølv</span></div><div class="trophy-box"><strong>🥉 ${careerStats.bronze}</strong><span>bronse</span></div></div></div><div class="career-deck">${playerHistory.map(row=>`<div class="season-card ${seasonClass(row.rank)}"><div class="season-kicker">${row.tournament||"Mesterskap"} ${row.year}</div><div class="season-rank-big">${rankDisplay(row.rank)}</div><div class="season-meta">#${cleanNumber(row.rank)} av ${cleanNumber(row.players)}</div></div>`).join("")}<div class="season-card live"><div class="season-kicker">VM 2026</div><div class="season-rank-big">#${cleanNumber(player.rank)}</div><div class="season-meta">live av ${allRows.length}<br>turneringen pågår</div></div></div></div>`}
function renderLastResults(player){const rows=[player.last_1,player.last_2,player.last_3,player.last_4,player.last_5,player.last_6,player.last_7,player.last_8].filter(Boolean);if(rows.length===0)return"";return`<div class="panel"><h2 class="section-title">Siste 8 resultater</h2><div class="compact-bonus-list">${rows.map(row=>`<span class="compact-bonus-pill">${row}</span>`).join("")}</div></div>`}
function renderNextTips(player){const rows=[{match:player.next_1_match,tip:player.next_1_tip},{match:player.next_2_match,tip:player.next_2_tip},{match:player.next_3_match,tip:player.next_3_tip},{match:player.next_4_match,tip:player.next_4_tip}].filter(row=>row.match&&row.tip);if(rows.length===0)return"";return`<div class="panel"><h2 class="section-title">Neste 4 tips</h2><div class="compact-bonus-list">${rows.map(row=>`<span class="compact-bonus-pill">${row.match} <strong>${row.tip}</strong></span>`).join("")}</div></div>`}
function renderMatchHistory(historyRows,player){const rows=historyRows.filter(row=>String(row.phone||"").trim()===String(player.phone||"").trim()).sort((a,b)=>cleanNumber(b.match_id)-cleanNumber(a.match_id));if(rows.length===0)return"";return`<div class="panel"><h2 class="section-title">Poenghistorikk</h2>${rows.map(row=>{const points=cleanNumber(row.points);const icon=row.reason==="Eksakt"?"🎯":row.reason==="Målforskjell"?"📏":row.reason==="Utfall"?"⚽":"❌";const pointColor=points>=8?"#7ee35f":points>=4?"#ffd166":points>0?"#8fd3ff":"#ff7b7b";return`<div style="display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);"><div><strong>${row.match}</strong><div class="note">${icon} Du: ${row.tip} · Resultat: ${row.result} · ${row.reason}</div></div><strong style="color:${pointColor};white-space:nowrap;">+${prettyPoints(points)} p</strong></div>`}).join("")}</div>`}
async function loadProfile(){const content=document.getElementById("content"),queryName=getQueryName().trim().toLowerCase();if(!queryName){content.innerHTML=`<div class="error">Mangler navn i URL.</div>`;return}try{const[rows,historyRows,careerHistoryRows]=await Promise.all([fetchSheet(PROFILE_CACHE_URL),fetchSheet(MATCH_HISTORY_URL),fetchSheet(HISTORY_URL)]);rows.sort((a,b)=>cleanNumber(a.rank)-cleanNumber(b.rank)||cleanNumber(b.points)-cleanNumber(a.points)||String(a.name||"").localeCompare(String(b.name||""),"no"));const player=rows.find(row=>String(row.name||"").trim().toLowerCase()===queryName);if(!player){content.innerHTML=`<div class="error">Fant ikke denne spilleren i API_PROFILE_CACHE. Kjør updateProfileCache().</div>`;return}const leader=rows[0],behindLeader=leader?Math.max(0,cleanNumber(leader.points)-cleanNumber(player.points)):0,ratings=getRatings(player,rows),nameParts=getShortNameParts(player.name),initials=getInitials(player.name),played=cleanNumber(player.played);const hitPercent=played?Math.round(((cleanNumber(player.exact)+cleanNumber(player.diff)+cleanNumber(player.outcome))/played)*100):0;const pointsPerMatch=played?(cleanNumber(player.points)/played).toFixed(1).replace(".",","):"0";const statComment=getStatComment(player,ratings),playerCareerHistory=getPlayerHistory(careerHistoryRows,player.name),careerStats=getCareerStats(playerCareerHistory);content.innerHTML=`<div class="profile-layout"><div><div class="fut-card"><div class="fut-top"><div><div class="ovr">${ratings.ovr}<span>OVR</span></div></div><div class="card-logo">FCB</div></div><div class="player-photo-wrap"><img id="profilePhoto" class="player-photo" alt="${player.name}" onerror="handlePhotoError(this,'${initials}')"></div><div class="card-name">${nameParts.map(part=>`<span>${part}</span>`).join("")}</div>${renderCardCareerBadges(careerStats)}<div class="card-stats">
  <div class="card-stat">
    <strong>${prettyPoints(player.points)}</strong>
    <span>POENG</span>
  </div>

  <div class="card-stat">
    <strong>${prettyPoints(behindLeader)}</strong>
    <span>BAK LEDER</span>
  </div>

  <div class="card-stat">
    <strong>${pointsPerMatch}</strong>
    <span>POENG/KAMP</span>
  </div>

  <div class="card-stat">
    <strong>${cleanNumber(player.exact)}</strong>
    <span>EKSAKTE</span>
  </div>
</div></div></div><div>><div class="panel"><h2 class="section-title">Kortanalyse</h2><div class="note">${statComment}</div></div><div class="panel"><h2 class="section-title">Bonusvalg</h2><div class="bonus-grid">${renderRtgChoice(player)}${renderBonusChoice("Toppscorer","⚽",player.top_scorer_all||player.top_scorer,player.top_scorer_points_all||player.top_scorer_points)}${renderBonusChoice("Beste spiller","⭐",player.best_player_all||player.best_player,player.best_player_points_all||player.best_player_points)}</div></div><div class="panel"><h2 class="section-title">Statistikk</h2><div class="mini-grid"><div class="mini-box"><strong>${hitPercent}%</strong><span>treffprosent</span></div><div class="mini-box"><strong>${cleanNumber(player.underdog)}</strong><span>outsider</span></div><div class="mini-box"><strong>${cleanNumber(player.exact)}</strong><span>eksakte</span></div></div></div>${renderCareerPanel(careerHistoryRows,player,rows)}${renderLastResults(player)}${renderNextTips(player)}${renderMatchHistory(historyRows,player)}<div class="panel"><a class="link-button" href="minetips.html">Se mine kamptips</a></div></div></div>`;const img=document.getElementById("profilePhoto");setPhotoWithFallback(img,player.name,rows)}catch(error){console.error(error);content.innerHTML=`<div class="error">Klarte ikke å laste profil.</div>`}}
loadProfile();
</script>
