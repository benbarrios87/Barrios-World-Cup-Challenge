
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil | FC Barrios World Cup Challenge 2026</title>

<style>
:root{
  --bg:#03100b;
  --card:rgba(5,18,13,0.86);
  --card2:rgba(255,255,255,0.075);
  --line:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.70);

  --gold:#ffd166;

}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(255,209,102,0.18), transparent 32%),
    radial-gradient(circle at top right, rgba(46,204,113,0.18), transparent 30%),
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.88)),

  background-position:center;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at center, transparent 0 140px, rgba(255,255,255,0.045) 141px 143px, transparent 144px),
    linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,0.06) 50%, transparent 50.2%);

}

.wrapper{
  max-width:1180px;
  margin:auto;
  padding:24px;
  position:relative;
  z-index:1;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:white;
  text-decoration:none;
  opacity:0.86;
  font-weight:bold;
}

.header{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:center;
  margin-bottom:18px;
}

.brand{
  text-align:right;
}

.brand h1{
  margin:0;
  font-size:34px;
  font-style:italic;
  letter-spacing:-1px;
}

.brand span{
  color:var(--green);
  font-weight:bold;
  font-size:13px;
  letter-spacing:1px;
}

.loading,
.error{
  background:var(--card);
  border:1px solid var(--line);

.error{ color:#ffb4b4; }

.profile-layout{

  grid-template-columns:420px 1fr;

}

.fut-card{

    0 30px 70px rgba(0,0,0,0.48),
    inset 0 0 0 3px rgba(255,255,255,0.25),

}

.fut-card::before{
  content:"";
  position:absolute;
  inset:16px;
  border:2px solid rgba(72,42,0,0.48);
  border-radius:28px;
  pointer-events:none;
}

.fut-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.22) 35%, transparent 46%),
    repeating-linear-gradient(135deg, rgba(255,255,255,0.09) 0 2px, transparent 2px 18px);
  opacity:0.32;
  pointer-events:none;
}

.fut-top{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.ovr{
  font-size:72px;
  line-height:0.85;
  font-weight:900;
  letter-spacing:-3px;
}

.ovr span{
  display:block;
  font-size:24px;
  letter-spacing:0;
  margin-top:8px;
}

.flag{
  font-size:34px;
  margin-top:10px;
}

.card-logo{
  font-weight:900;
  font-size:18px;
  border:2px solid rgba(0,0,0,0.35);
  border-radius:12px;
  padding:8px 9px;
  background:rgba(255,255,255,0.25);
}

.player-photo-wrap{
  position:relative;
  z-index:2;
  height:280px;
  margin-top:-40px;
  margin:2px 0 8px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.player-photo{
  max-height:380px;
  position:relative;
  top:20px;
  max-width:100%;
  object-fit:contain;
   margin-top:-60px;

}

.photo-fallback{
  width:190px;
  height:190px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.22);
  border:3px solid rgba(0,0,0,0.22);

}

.card-name{

  z-index:2;

.card-name span{

.card-stats{

.card-stat{

}

.card-stat:last-child{ border-right:none; }

.card-stat strong{
  display:block;
  font-size:30px;
  line-height:1;
}

.card-stat span{
  display:block;
  font-size:13px;
  font-weight:900;
  margin-top:4px;
}

.boot{
  position:relative;
  z-index:2;
  text-align:center;
  margin-top:18px;
  font-size:24px;
}

.panel{

  padding:22px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);

}

.player-panel{
  display:grid;
  grid-template-columns:1fr 150px;
  gap:18px;
  align-items:center;
}

.player-name{

  font-weight:900;
  margin-bottom:10px;

}

.info-line{
  color:var(--muted);

}

.rank-shield{
  border-radius:22px;
  background:
    linear-gradient(145deg, rgba(255,209,102,0.24), rgba(0,0,0,0.18));
  border:1px solid rgba(255,209,102,0.35);
  text-align:center;
  padding:18px 12px;
}

.rank-shield strong{
  display:block;
  font-size:60px;
  color:var(--gold);

}

.rank-shield span{
  display:block;

}

.mini-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);

}

.mini-box{
  background:rgba(0,0,0,0.22);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.mini-box strong{
  display:block;
  font-size:36px;
  color:var(--gold);
}

.mini-box span{
  color:var(--muted);
  font-size:13px;
}

.section-title{
  margin:0 0 16px;
  font-size:22px;
  color:var(--green);
  text-transform:uppercase;
  letter-spacing:.6px;
}

.bonus-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.bonus-choice{

.bonus-choice .label{

.bonus-choice .pick{

  font-weight:bold;

}

.bonus-choice .pts{

}

.next-list,

  gap:10px;
}
  .compact-bonus-list{
  display:flex;
  flex-wrap:wrap;

}

.compact-bonus-pill{

  border:1px solid rgba(255,255,255,0.12);

  font-size:13px;

}

.compact-bonus-pill strong{
  color:var(--gold);
}

.next-row,
.hit-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:13px;
  border-radius:16px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.10);
}

.next-match,
.hit-match{

}

.next-date,
.hit-meta{

  margin-top:4px;
}

.next-score,
.hit-points{

  font-size:22px;
  font-weight:900;
  white-space:nowrap;
}

.attributes{
  display:grid;
  gap:12px;
}

.attr-row{
  display:grid;
  grid-template-columns:120px 1fr 38px;
  gap:12px;
  align-items:center;
}

.attr-name{
  color:var(--muted);
  font-size:13px;
}

.attr-bar{
  height:12px;
  border-radius:999px;
  background:rgba(255,255,255,0.10);
  overflow:hidden;
}

.attr-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#2ecc71,#b4ff63);
}

.attr-value{
  color:var(--gold);
  font-weight:bold;
  text-align:right;
}

.tips-toggle{
  width:100%;
  border:none;
  color:white;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.13);
  border-radius:18px;
  padding:16px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.all-tips{
  display:none;
  margin-top:14px;
}

.tip-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.tip-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.tip-match{
  font-weight:bold;
  font-size:17px;
}

.tip-score{
  font-size:22px;
  font-weight:bold;
  color:var(--gold);
  text-align:right;
}

.tip-id{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.match-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;
  padding:6px 10px;
  font-size:13px;
}

.pill.good{
  background:rgba(46,204,113,0.14);
  border-color:rgba(46,204,113,0.25);
  color:#9dffc7;
}

.pill.bad{
  background:rgba(255,94,94,0.12);
  border-color:rgba(255,94,94,0.25);
  color:#ffb4b4;
}

.pill.gold{
  background:rgba(255,209,102,0.13);
  border-color:rgba(255,209,102,0.25);
  color:var(--gold);
}

.footer-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:980px){
  .profile-layout{
    grid-template-columns:1fr;
  }

  .fut-card{
    max-width:430px;
    margin:auto;
  }

  .header{
    display:block;
  }

  .brand{
    text-align:left;
  }
}

@media(max-width:700px){
  .wrapper{ padding:14px; }
  .player-panel{ grid-template-columns:1fr; }
  .mini-grid{ grid-template-columns:1fr; }
  .bonus-grid{ grid-template-columns:1fr; }
  .player-name{ font-size:30px; }
  .fut-card{ min-height:560px; }
  .ovr{ font-size:62px; }

  .card-name{ font-size:32px; }
  .tip-top,
  .next-row,
  .hit-row{ grid-template-columns:1fr; }
  .tip-score,
  .next-score,
  .hit-points{ text-align:left; }
}
</style>

  <div class="header">

      <h1>FC BARRIOS</h1>
      <span>WORLD CUP CHALLENGE 2026</span>
    </div>
  </div>

  <div id="content">
    <div class="loading">Laster FUT-profil...</div>
  </div>

  <div class="footer-note">
    FC Barrios World Cup Challenge 2026
  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const REGISTRATIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;
const SUBMISSIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;
const MATCHES_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;
const RESULTS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_RESULTS`;
const OUTCOME_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_OUTCOME`;
const DIFF_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_DIFF`;
const EXACT_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_EXACT`;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();
    if(!Array.isArray(data)) return [];
    return data.map(normalizeRow);
  }catch(error){
    console.error(error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};
  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });
  return clean;
}

function isBlank(value){
  return value === "" || value === null || value === undefined;
}

function cleanNumber(value){
  if(isBlank(value)) return 0;
  return Number(String(value).replace(/\s/g,"").replace(",",".")) || 0;
}

function parseTier(value){
  if(isBlank(value)) return 4;
  const found = String(value).match(/[1-4]/);
  return found ? Number(found[0]) : 4;
}

function getInitials(name){
  return String(name || "")
    .split(" ")
    .map(part => part[0] || "")
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function getQueryName(){
  const params = new URLSearchParams(window.location.search);
  return params.get("name") || "";
}

function slugifyName(name){
  const lower = String(name || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

  if(lower.includes("anders") && (lower.includes("uldalden") || lower.includes("brosstad") || lower.includes("brosstand"))){
    return "andersub";
  }

  return lower.split(/\s+/)[0] || "default";
}

function getPhotoSrc(name){
  return `${slugifyName(name)}.png`;
}

function handlePhotoError(img, initials){
  const wrap = img.parentElement;
  if(!wrap) return;

  wrap.innerHTML = `<div class="photo-fallback">${initials}</div>`;
}

function getOutcome(home,away){
  home = cleanNumber(home);
  away = cleanNumber(away);

  if(home > away) return "home";
  if(away > home) return "away";
  return "draw";
}

function getTierType(match,outcome){
  if(outcome === "draw") return "draw";

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);

  if(outcome === "home"){
    return homeTier <= awayTier ? "favorite" : "underdog";
  }

  if(outcome === "away"){
    return awayTier <= homeTier ? "favorite" : "underdog";
  }

  return "draw";
}

function getRulePoint(rules,tierDiff,type){
  const row = rules.find(r => cleanNumber(r.tier_diff) === cleanNumber(tierDiff));
  if(!row) return 0;

  if(type === "favorite") return cleanNumber(row.favorite || row.favoritt);
  if(type === "draw") return cleanNumber(row.draw || row.uavgjort);
  if(type === "underdog") return cleanNumber(row.underdog || row.outsider);

  return 0;
}

function getLatestRowsForPhone(rows, phone){
  const userRows = rows.filter(row =>
    String(row.phone || "").trim() === String(phone || "").trim()
  );

  if(userRows.length === 0) return [];

  const latestTimestamp = userRows[userRows.length - 1].timestamp;

  return userRows.filter(row => row.timestamp === latestTimestamp);
}

function hasResult(result){
  return result &&
    !isBlank(result.actual_home) &&
    !isBlank(result.actual_away);
}

function calculateMatch(tip, match, result, outcomeRules, diffRules, exactRules){
  if(!match || !hasResult(result)){
    return {
      status:"Ikke spilt",
      points:0,
      className:"",
      actualText:"Ikke spilt"
    };
  }

  if(isBlank(tip.tips_home) || isBlank(tip.tips_away)){
    return {
      status:"Mangler tips",
      points:0,
      className:"bad",
      actualText:`${result.actual_home} - ${result.actual_away}`
    };
  }

  const tipHome = cleanNumber(tip.tips_home);
  const tipAway = cleanNumber(tip.tips_away);
  const actualHome = cleanNumber(result.actual_home);
  const actualAway = cleanNumber(result.actual_away);

  const tipOutcome = getOutcome(tipHome,tipAway);
  const actualOutcome = getOutcome(actualHome,actualAway);

  const tipDiff = tipHome - tipAway;
  const actualDiff = actualHome - actualAway;

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);
  const tierDiff = Math.abs(homeTier - awayTier);
  const tierType = getTierType(match,tipOutcome);

  if(tipHome === actualHome && tipAway === actualAway){
    return {
      status:"Eksakt resultat",
      points:getRulePoint(exactRules,tierDiff,tierType),
      className:"gold",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipDiff === actualDiff){
    return {
      status:"Riktig målforskjell",
      points:getRulePoint(diffRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipOutcome === actualOutcome){
    return {
      status:"Riktig utfall",
      points:getRulePoint(outcomeRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  return {
    status:"Bom",
    points:0,
    className:"bad",
    actualText:`${actualHome} - ${actualAway}`
  };
}

function getFullName(row){
  return (
    row.full_name ||
    row["full name"] ||
    `${row.first_name || row["first name"] || ""} ${row.last_name || row["last name"] || ""}`.trim()
  );
}

function renderBonusChoice(rows, title, icon){
  const positive = rows
    .filter(row => cleanNumber(row.extra_points) > 0)
    .sort((a,b) => cleanNumber(b.extra_points) - cleanNumber(a.extra_points));

  if(positive.length === 0){
    return `
      <div class="bonus-choice">
        <div class="label">${icon} ${title}</div>
        <div class="pick">Ikke fylt ut</div>
        <div class="pts">0 mulig poeng</div>
      </div>
    `;
  }

  return `
    <div class="bonus-choice">
      <div class="label">${icon} ${title}</div>

      <div class="compact-bonus-list">
        ${positive.map(row => `
          <span class="compact-bonus-pill">
            ${row.extra_name || "-"} <strong>+${cleanNumber(row.extra_points)}</strong>
          </span>
        `).join("")}
      </div>
    </div>
  `;
}

function getNextThreeTips(matchRows, matches, resultMap){
  return matches
    .filter(match => {
      const id = String(match.id || match.match_id || "").trim();
      return id && !hasResult(resultMap[id]);
    })
    .slice(0,3)
    .map(match => {
      const matchId = String(match.id || match.match_id || "").trim();
      const tip = matchRows.find(row => String(row.match_id || row.id || "").trim() === matchId);

      return {
        home: match.home || "",
        away: match.away || "",
        date: match.date || match.dato || "",
        tips_home: tip ? tip.tips_home : "",
        tips_away: tip ? tip.tips_away : ""
      };
    });
}

function renderNextThree(nextTips){
  if(!nextTips.length){
    return `<div style="color:rgba(255,255,255,0.7);">Ingen kommende kamper funnet.</div>`;
  }

  return `
    <div class="next-list">
      ${nextTips.map(tip => `
        <div class="next-row">
          <div>
            <div class="next-match">${tip.home} vs ${tip.away}</div>
            <div class="next-date">${tip.date || ""}</div>
          </div>
          <div class="next-score">
            ${!isBlank(tip.tips_home) && !isBlank(tip.tips_away) ? `${tip.tips_home} - ${tip.tips_away}` : "—"}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function clamp(value,min,max){
  return Math.max(min, Math.min(max, value));
}

function toRating(value, maxValue){
  if(maxValue <= 0) return 65;
  return clamp(Math.round(65 + (value / maxValue) * 34), 65, 99);
}

function getRatings(playerRow, allRows){
  const maxPoints = Math.max(...allRows.map(row => row.totalPoints), 1);
  const maxExact = Math.max(...allRows.map(row => row.exactCount), 1);
  const maxUnderdog = Math.max(...allRows.map(row => row.underdogCount), 1);
  const maxDiff = Math.max(...allRows.map(row => row.diffCount), 1);

  const tip = toRating(playerRow.exactCount + playerRow.diffCount * 0.6, maxExact + maxDiff * 0.6);
  const out = toRating(playerRow.underdogCount, maxUnderdog);
  const res = toRating(playerRow.totalPoints, maxPoints);
  const luk = toRating(playerRow.diffCount + playerRow.outcomeCount * 0.25, maxDiff + Math.max(...allRows.map(row => row.outcomeCount), 1) * 0.25);

  const ovr = Math.round((tip + out + res + luk) / 4);

  return { tip, out, res, luk, ovr };
}

function getShortNameParts(name){
  const parts = String(name || "").trim().split(/\s+/);

  if(parts.length <= 1){
    return [parts[0] || ""];
  }

  return [parts[0], parts[parts.length - 1]];
}

function renderAllTips(tipsHtml){
  return `
    <button class="tips-toggle" onclick="toggleAllTips()">Vis alle kamptips →</button>
    <div id="allTips" class="all-tips">
      ${tipsHtml || `<div style="color:rgba(255,255,255,0.7);">Ingen tips registrert.</div>`}
    </div>
  `;
}

function toggleAllTips(){
  const box = document.getElementById("allTips");
  const btn = document.querySelector(".tips-toggle");

  if(!box || !btn) return;

  const visible = box.style.display === "block";

  box.style.display = visible ? "none" : "block";
  btn.textContent = visible ? "Vis alle kamptips →" : "Skjul kamptips ↑";
}

async function loadProfile(){
  const content = document.getElementById("content");
  const queryName = getQueryName().trim().toLowerCase();

  if(!queryName){
    content.innerHTML = `<div class="error">Mangler navn i URL.</div>`;
    return;
  }

  try{
    const [
      registrations,
      submissions,
      matches,
      results,
      outcomeRules,
      diffRules,
      exactRules
    ] = await Promise.all([
      fetchSheet(REGISTRATIONS_URL),
      fetchSheet(SUBMISSIONS_URL),
      fetchSheet(MATCHES_URL),
      fetchSheet(RESULTS_URL),
      fetchSheet(OUTCOME_URL),
      fetchSheet(DIFF_URL),
      fetchSheet(EXACT_URL)
    ]);

    const matchMap = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchMap[id] = match;
    });

    const resultMap = {};
    results.forEach(result => {
      const id = String(result.id || result.match_id || "").trim();
      if(id) resultMap[id] = result;
    });

    const players = registrations
      .map(row => ({
        ...row,
        name:getFullName(row),
        phone:String(row.phone || "").trim()
      }))
      .filter(row => row.name && row.phone);

    const player = players.find(row => row.name.trim().toLowerCase() === queryName);

    if(!player){
      content.innerHTML = `<div class="error">Fant ikke denne spilleren.</div>`;
      return;
    }

    const allPlayerRows = players.map(p => {
      const latestRows = getLatestRowsForPhone(submissions,p.phone);
      const matchRows = latestRows.filter(row => row.type === "match");

      let totalPoints = 0;
      let exactCount = 0;
      let diffCount = 0;
      let outcomeCount = 0;
      let underdogCount = 0;
      let playedCount = 0;

      matchRows.forEach(row => {
        const matchId = String(row.match_id || row.id || "").trim();
        const match = matchMap[matchId];
        const result = resultMap[matchId];

        const calc = calculateMatch(row, match, result, outcomeRules, diffRules, exactRules);
        totalPoints += calc.points;

        if(calc.status !== "Ikke spilt") playedCount++;
        if(calc.status === "Eksakt resultat") exactCount++;
        if(calc.status === "Riktig målforskjell") diffCount++;
        if(calc.status === "Riktig utfall") outcomeCount++;

        if(calc.points > 0 && match){
          const tipOutcome = getOutcome(row.tips_home,row.tips_away);
          if(getTierType(match,tipOutcome) === "underdog"){
            underdogCount++;
          }
        }
      });

      return {
        ...p,
        latestRows,
        matchRows,
        totalPoints,
        exactCount,
        diffCount,
        outcomeCount,
        underdogCount,
        playedCount
      };
    }).sort((a,b) =>
      cleanNumber(b.totalPoints) - cleanNumber(a.totalPoints) ||
      cleanNumber(b.exactCount) - cleanNumber(a.exactCount) ||
      a.name.localeCompare(b.name,"no")
    );

    const playerStats = allPlayerRows.find(row => row.phone === player.phone);
    const rank = allPlayerRows.findIndex(row => row.phone === player.phone) + 1;
    const leader = allPlayerRows[0];
    const behindLeader = leader ? Math.max(0, leader.totalPoints - playerStats.totalPoints) : 0;

    const latestRows = playerStats.latestRows;
    const matchRows = playerStats.matchRows;
    const bestPlayerRows = latestRows.filter(row => row.type === "bestplayer");
    const topScorerRows = latestRows.filter(row => row.type === "topscorer");

    const ratings = getRatings(playerStats, allPlayerRows);
    const nameParts = getShortNameParts(player.name);
    const photoSrc = getPhotoSrc(player.name);
    const initials = getInitials(player.name);

    const nextTips = getNextThreeTips(matchRows, matches, resultMap);

    let bestHits = [];

    const tipsHtml = matchRows.map(row => {
      const matchId = String(row.match_id || row.id || "").trim();
      const match = matchMap[matchId];
      const result = resultMap[matchId];

      const calc = calculateMatch(
        row,
        match,
        result,
        outcomeRules,
        diffRules,
        exactRules
      );

      if(calc.points > 0 && match){
        bestHits.push({
          match:`${match.home} ${calc.actualText} ${match.away}`,
          meta:`Kamp ${matchId}`,
          points:calc.points
        });
      }

      return `
        <div class="tip-card">
          <div class="tip-top">
            <div>
              <div class="tip-match">
                ${match ? `${match.home} vs ${match.away}` : `Kamp ${matchId}`}
              </div>
              <div class="tip-id">Kamp ${matchId}</div>
            </div>

            <div class="tip-score">
              ${isBlank(row.tips_home) || isBlank(row.tips_away)
                ? "Mangler"
                : `${row.tips_home} - ${row.tips_away}`
              }
            </div>
          </div>

          <div class="match-meta">
            <span class="pill">Resultat: ${calc.actualText}</span>
            <span class="pill ${calc.className}">${calc.status}</span>
            <span class="pill gold">${calc.points} poeng</span>
          </div>
        </div>
      `;
    }).join("");

    bestHits = bestHits.sort((a,b) => b.points - a.points).slice(0,3);

    const hitHtml = bestHits.length
      ? `<div class="hit-list">
          ${bestHits.map(hit => `
            <div class="hit-row">
              <div>
                <div class="hit-match">${hit.match}</div>
                <div class="hit-meta">${hit.meta}</div>
              </div>
              <div class="hit-points">+${hit.points}</div>
            </div>
          `).join("")}
        </div>`
      : `<div style="color:rgba(255,255,255,0.7);">Beste treff dukker opp når kampene er spilt.</div>`;

    const played = playerStats.playedCount;
    const hitPercent = played
      ? Math.round(((playerStats.exactCount + playerStats.diffCount + playerStats.outcomeCount) / played) * 100)
      : 0;

    const pointsPerMatch = played
      ? (playerStats.totalPoints / played).toFixed(1).replace(".",",")
      : "0";

    content.innerHTML = `
      <div class="profile-layout">
        <div>
          <div class="fut-card">
            <div class="fut-top">
              <div>
                <div class="ovr">${ratings.ovr}<span>OVR</span></div>
                <div class="flag">🇳🇴</div>
              </div>
              <div class="card-logo">FCB</div>
            </div>

            <div class="player-photo-wrap">
              <img
                class="player-photo"
                src="${photoSrc}"
                alt="${player.name}"
                onerror="handlePhotoError(this,'${initials}')"
              >
            </div>

            <div class="card-name">
              ${nameParts.map(part => `<span>${part}</span>`).join("")}
            </div>

            <div class="card-stats">
              <div class="card-stat"><strong>${ratings.tip}</strong><span>TIP</span></div>
              <div class="card-stat"><strong>${ratings.out}</strong><span>OUT</span></div>
              <div class="card-stat"><strong>${ratings.res}</strong><span>RES</span></div>
              <div class="card-stat"><strong>${ratings.luk}</strong><span>LUK</span></div>
            </div>

            <div class="boot">⚽</div>
          </div>
        </div>

        <div>
          <div class="panel player-panel">
            <div>
              <div class="player-name">${player.name}</div>
              <div class="info-line">🇳🇴 Norge</div>
              <div class="info-line">🎯 Rolle: Tippinator</div>
              <div class="info-line">🧊 Kjent for: kalde tips og store baller</div>
            </div>

            <div class="rank-shield">
              <strong>${rank}.</strong>
              <span>plassering av ${allPlayerRows.length}</span>
            </div>
          </div>

          <div class="panel">
            <div class="mini-grid">
              <div class="mini-box">
                <strong>${playerStats.totalPoints}</strong>
                <span>poeng</span>
              </div>

              <div class="mini-box">
                <strong>${behindLeader}</strong>
                <span>bak lederen</span>
              </div>

              <div class="mini-box">
                <strong>${pointsPerMatch}</strong>
                <span>poeng per kamp</span>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2 class="section-title">Dine bonusvalg</h2>
            <div class="bonus-grid">
              ${renderBonusChoice(topScorerRows,"Toppscorer","⚽")}
              ${renderBonusChoice(bestPlayerRows,"Beste spiller","⭐")}
            </div>
          </div>

          <div class="panel">
            <h2 class="section-title">Neste 3 kamper</h2>
            ${renderNextThree(nextTips)}
          </div>

          <div class="panel">
            <h2 class="section-title">Din statistikk</h2>

            <div class="mini-grid">
              <div class="mini-box">
                <strong>${hitPercent}%</strong>
                <span>treffprosent</span>
              </div>

              <div class="mini-box">
                <strong>${playerStats.underdogCount}</strong>
                <span>outsider-treff</span>
              </div>

              <div class="mini-box">
                <strong>${playerStats.exactCount}</strong>
                <span>eksakte treff</span>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2 class="section-title">Egenskaper</h2>

            <div class="attributes">
              <div class="attr-row">
                <div class="attr-name">Presisjon</div>
                <div class="attr-bar"><div class="attr-fill" style="width:${ratings.tip}%"></div></div>
                <div class="attr-value">${ratings.tip}</div>
              </div>

              <div class="attr-row">
                <div class="attr-name">Outsider-talent</div>
                <div class="attr-bar"><div class="attr-fill" style="width:${ratings.out}%"></div></div>
                <div class="attr-value">${ratings.out}</div>
              </div>

              <div class="attr-row">
                <div class="attr-name">Resultatorientert</div>
                <div class="attr-bar"><div class="attr-fill" style="width:${ratings.res}%"></div></div>
                <div class="attr-value">${ratings.res}</div>
              </div>

              <div class="attr-row">
                <div class="attr-name">Flaksfaktor</div>
                <div class="attr-bar"><div class="attr-fill" style="width:${ratings.luk}%"></div></div>
                <div class="attr-value">${ratings.luk}</div>
              </div>
            </div>
          </div>

          <div class="panel">
            <h2 class="section-title">Dine beste treff</h2>
            ${hitHtml}
          </div>

          <div class="panel">
            ${renderAllTips(tipsHtml)}
          </div>
        </div>
      </div>
    `;

  }catch(error){
    console.error(error);
    content.innerHTML = `<div class="error">Klarte ikke å laste profil.</div>`;
  }
}

loadProfile();
</script>
