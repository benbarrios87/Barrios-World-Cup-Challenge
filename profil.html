
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil | FCBarrios World Cup Challenge 2026</title>
<style>
:root{--bg:#050713;--panel:rgba(10,13,28,.86);--line:rgba(255,255,255,.14);--text:#fff;--muted:rgba(255,255,255,.68);--gold:#ffd166;--green:#2ecc71;--pink:#ff4fd8;--red:#ff5e5e}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}body{font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 8%,rgba(255,79,216,.22),transparent 26%),radial-gradient(circle at 82% 12%,rgba(110,231,255,.17),transparent 25%),radial-gradient(circle at 50% 92%,rgba(46,204,113,.19),transparent 35%),linear-gradient(180deg,#060817 0%,#08111f 48%,#02040a 100%)}
.wrapper{max-width:1180px;margin:auto;padding:22px;position:relative;z-index:1}.header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px;padding:16px;border-radius:24px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13)}.back-link{color:#fff;text-decoration:none;font-weight:bold;border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.brand{text-align:right}.brand h1{margin:0;font-size:30px;letter-spacing:-1px;font-style:italic}.brand span{color:#9dffc7;font-weight:bold;font-size:12px;letter-spacing:1px}
.loading,.error,.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.28)}.error{color:#ffb4b4;line-height:1.6}.profile-layout{display:grid;grid-template-columns:370px 1fr;gap:20px;align-items:start}.panel{margin-bottom:16px;overflow:hidden}.section-title{margin:0 0 14px;font-size:20px;color:#9dffc7;text-transform:uppercase;letter-spacing:.6px}.note{color:var(--muted);line-height:1.5}
.fut-card{position:relative;min-height:520px;padding:28px 22px 22px;border-radius:34px;overflow:hidden;background:radial-gradient(circle at 70% 8%,rgba(255,255,255,.30),transparent 24%),linear-gradient(145deg,rgba(255,209,102,.96),rgba(114,72,17,.98) 50%,rgba(255,183,3,.96));color:#211805;box-shadow:0 30px 70px rgba(0,0,0,.48),inset 0 0 0 3px rgba(255,255,255,.24),inset 0 0 0 8px rgba(80,45,0,.20)}.fut-top{display:flex;justify-content:space-between;align-items:flex-start}.ovr{font-size:66px;line-height:.86;font-weight:900;letter-spacing:-3px}.ovr span{display:block;font-size:21px;letter-spacing:0;margin-top:7px}.card-logo{font-weight:900;font-size:17px;border:2px solid rgba(0,0,0,.35);border-radius:12px;padding:8px 9px;background:rgba(255,255,255,.25)}
.player-photo-wrap{height:255px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.player-photo{max-height:360px;max-width:112%;object-fit:contain;margin-top:-72px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.45))}.photo-fallback{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.22);border:3px solid rgba(0,0,0,.22);font-size:60px;font-weight:900}.card-name{text-align:center;font-size:32px;font-weight:900;line-height:.98;text-transform:uppercase;letter-spacing:-1px}.card-name span{display:block}.card-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px;border-top:2px solid rgba(0,0,0,.25);border-bottom:2px solid rgba(0,0,0,.25)}.card-stat{text-align:center;padding:11px 3px;border-right:1px solid rgba(0,0,0,.25)}.card-stat:last-child{border-right:none}.card-stat strong{display:block;font-size:27px;line-height:1}.card-stat span{display:block;font-size:11px;font-weight:900;margin-top:4px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini-box{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:14px;text-align:center}.mini-box strong{display:block;font-size:31px;color:var(--gold)}.mini-box span{color:var(--muted);font-size:12px}.compact-list{display:flex;flex-wrap:wrap;gap:8px}.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 10px;font-size:13px;color:rgba(255,255,255,.86)}.pill strong{color:var(--gold)}.rtg-pill{background:rgba(255,79,216,.14);border-color:rgba(255,79,216,.30);color:#ffb8ef;font-weight:bold}.history-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}.history-row:last-child{border-bottom:0}.points-plus{color:#7ee35f;font-weight:900;white-space:nowrap}.debug-list a{color:#9dffc7;text-decoration:none;font-weight:bold}
@media(max-width:900px){.profile-layout{grid-template-columns:1fr}.fut-card{max-width:390px;margin:auto}}@media(max-width:700px){.wrapper{padding:12px}.header{border-radius:18px;padding:12px}.brand h1{font-size:22px}.brand span{font-size:10px}.back-link{font-size:13px;padding:9px 11px}.panel{padding:14px;border-radius:18px}.mini-grid{grid-template-columns:1fr}.fut-card{width:min(100%,350px);min-height:auto;border-radius:28px;padding:22px 18px 18px}.ovr{font-size:54px}.ovr span{font-size:17px}.player-photo-wrap{height:260px;align-items:flex-end}.player-photo{max-height:330px;max-width:110%;margin-top:-35px}.card-name{font-size:27px}.card-stat strong{font-size:23px}.card-stat span{font-size:10px}}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header"><a class="back-link" href="leaderboard.html">← Til leaderboard</a><div class="brand"><h1>FC BARRIOS</h1><span>WORLD CUP CHALLENGE 2026</span></div></div>
  <div id="content"><div class="loading">Laster profil...</div></div>
</div>
<script>
const SHEET_ID="1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";
const PROFILE_CACHE_URL=`https://opensheet.elk.sh/${SHEET_ID}/API_PROFILE_CACHE`;
const MATCH_HISTORY_URL=`https://opensheet.elk.sh/${SHEET_ID}/API_MATCH_HISTORY`;
const HISTORY_URL=`https://opensheet.elk.sh/${SHEET_ID}/API_HISTORY`;

async function fetchSheet(url){
  try{
    const freshUrl = `${url}${url.includes("?") ? "&" : "?"}t=${Date.now()}`;
    const res = await fetch(freshUrl,{cache:"no-store"});
    const data = await res.json();
    if(!Array.isArray(data)) return [];
    return data.map(normalizeRow).filter(row => Object.values(row).some(v => String(v||"").trim() !== ""));
  }catch(err){ console.error("fetchSheet", url, err); return []; }
}
function normalizeRow(row){const clean={};Object.keys(row||{}).forEach(key=>{const k=String(key).trim().toLowerCase().replace(/\s+/g,"_").replace(/-/g,"_");clean[k]=typeof row[key]==="string"?row[key].trim():row[key];});return clean;}
function cleanNumber(v){if(v===undefined||v===null||v==="")return 0;return Number(String(v).replace(/\s/g,"").replace(",","."))||0;}
function pretty(v){const n=cleanNumber(v);return Number.isInteger(n)?String(n):n.toFixed(1).replace(/\.0$/,"");}
function slugify(v){return String(v||"").trim().toLowerCase().replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function normName(v){return slugify(v||"");}
function getQueryName(){
  const params = new URLSearchParams(window.location.search);
  let value = params.get("name") || params.get("player") || params.get("spiller") || "";
  if(!value) value = window.location.search.replace(/^\?/,"").trim();
  try{ value = decodeURIComponent(String(value).replace(/\+/g," ")).trim(); }catch(e){ value = String(value||"").trim(); }
  if(["nan","undefined","null"].includes(value.toLowerCase())) return "";
  return value;
}
function getInitials(name){return String(name||"").split(/\s+/).map(p=>p[0]||"").join("").slice(0,2).toUpperCase();}
function getShortNameParts(name){const p=String(name||"").trim().split(/\s+/);return p.length<=1?[p[0]||""]:[p[0],p[p.length-1]];}
function firstNameSlug(name){return slugify(String(name||"").trim().split(/\s+/)[0]||"default");}
function fullNameSlug(name){return slugify(name||"default");}
function getPhotoCandidates(name,rows){const first=firstNameSlug(name),full=fullNameSlug(name);const sameFirst=rows.filter(r=>firstNameSlug(r.name)===first).length;const c=[];if(sameFirst>1)c.push(`${full}.png`);if(first==="anders"&&(full.includes("uldalen")||full.includes("uldalden")||full.includes("brosstad")||full.includes("brosstand")))c.unshift("andersub.png");c.push(`${first}.png`);return [...new Set(c)];}
function setPhoto(img,name,rows){const c=getPhotoCandidates(name,rows);img.dataset.candidates=JSON.stringify(c);img.dataset.index="0";img.src=c[0]||"default.png";}
function handlePhotoError(img,initials){let c=[];try{c=JSON.parse(img.dataset.candidates||"[]")}catch(e){}const i=Number(img.dataset.index||0)+1;if(i<c.length){img.dataset.index=String(i);img.src=c[i];return;}img.parentElement.innerHTML=`<div class="photo-fallback">${initials}</div>`;}
function toRating(value,max){if(max<=0)return 75;return Math.max(75,Math.min(99,Math.round(75+(value/max)*24)));}
function getRatings(player,rows){const maxPoints=Math.max(...rows.map(r=>cleanNumber(r.points)),1);const maxExact=Math.max(...rows.map(r=>cleanNumber(r.exact)),1);const maxUnderdog=Math.max(...rows.map(r=>cleanNumber(r.underdog)),1);const maxDiff=Math.max(...rows.map(r=>cleanNumber(r.diff)),1);const maxOutcome=Math.max(...rows.map(r=>cleanNumber(r.outcome)),1);const tip=toRating(cleanNumber(player.exact)+cleanNumber(player.diff)*.6,maxExact+maxDiff*.6);const out=toRating(cleanNumber(player.underdog),maxUnderdog);const res=toRating(cleanNumber(player.points),maxPoints);const luk=toRating(cleanNumber(player.diff)+cleanNumber(player.outcome)*.25,maxDiff+maxOutcome*.25);return{ovr:Math.round((tip+out+res+luk)/4),tip,out,res,luk};}
function splitBonus(names,points){const n=String(names||"").split("|").map(x=>x.trim()).filter(Boolean);const p=String(points||"").split("|").map(x=>x.trim());return n.map((name,i)=>({name,points:cleanNumber(p[i])}));}
function renderBonus(title,icon,names,points){const items=splitBonus(names,points);if(!items.length)return`<div class="pill">${icon} ${title}: <strong>Ikke fylt ut</strong></div>`;return items.map(i=>`<span class="pill">${icon} ${i.name} <strong>+${pretty(i.points)}</strong></span>`).join("");}
function renderRtg(player){const raw=String(player.rtg_picks||"").split("|").map(x=>x.trim()).filter(Boolean);const pts=cleanNumber(player.rtg_points);if(!raw.length && pts===0)return"";const picks=raw.map(item=>{const p=item.split("~");return{team:p[0]||item,stake:p[1]||"",current:p[2]||0,status:p[4]||""};});return`<div class="panel"><h2 class="section-title">🧨 Road to Glory</h2><div class="compact-list">${picks.map(p=>`<span class="pill rtg-pill">${p.status==="alive"?"🟢":"🔴"} ${p.team} ${p.stake?p.stake+"p":""} <strong>+${pretty(p.current)}</strong></span>`).join("")}<span class="pill rtg-pill">Totalt <strong>+${pretty(pts)}</strong></span></div></div>`;}
function renderNextTips(player){const rows=[1,2,3,4].map(i=>({match:player[`next_${i}_match`],tip:player[`next_${i}_tip`]})).filter(r=>r.match);if(!rows.length)return"";return`<div class="panel"><h2 class="section-title">Neste 4 tips</h2><div class="compact-list">${rows.map(r=>`<span class="pill">${r.match} <strong>${r.tip || "Mangler tips"}</strong></span>`).join("")}</div></div>`;}
function renderLastResults(player){const rows=[1,2,3,4,5,6,7,8].map(i=>player[`last_${i}`]).filter(Boolean);if(!rows.length)return"";return`<div class="panel"><h2 class="section-title">Siste 8 resultater</h2><div class="compact-list">${rows.map(r=>`<span class="pill">${r}</span>`).join("")}</div></div>`;}
function renderMatchHistory(historyRows,player){const rows=historyRows.filter(r=>String(r.phone||"").trim()===String(player.phone||"").trim()).sort((a,b)=>cleanNumber(b.match_id)-cleanNumber(a.match_id));if(!rows.length)return"";return`<div class="panel"><h2 class="section-title">Poenghistorikk</h2>${rows.map(r=>`<div class="history-row"><div><strong>${r.match||"Kamp "+(r.match_id||"")}</strong><div class="note">Du: ${r.tip||""} · Resultat: ${r.result||""} · ${r.reason||""}</div></div><div class="points-plus">+${pretty(r.points)} p</div></div>`).join("")}</div>`;}
function renderDebug(rawName,queryName,rows){return`<div class="error"><strong>Fant ikke spiller.</strong><br><br>Søkte etter: <strong>${rawName || "(tomt)"}</strong><br>Normalisert: <strong>${queryName || "(tomt)"}</strong><br>Antall rader i API_PROFILE_CACHE: <strong>${rows.length}</strong><br><br><div class="debug-list">${rows.slice(0,12).map(r=>`<a href="profil.html?name=${encodeURIComponent(r.name||"")}">${r.name||"(uten navn)"}</a> → ${normName(r.name)}`).join("<br>")}</div></div>`;}
async function loadProfile(){
  const content=document.getElementById("content");
  const rawName=getQueryName();
  const queryName=normName(rawName);
  const [rows,historyRows] = await Promise.all([fetchSheet(PROFILE_CACHE_URL),fetchSheet(MATCH_HISTORY_URL)]);
  rows.sort((a,b)=>cleanNumber(a.rank)-cleanNumber(b.rank)||cleanNumber(b.points)-cleanNumber(a.points)||String(a.name||"").localeCompare(String(b.name||""),"no"));
  if(!queryName){content.innerHTML=renderDebug(rawName,queryName,rows);return;}
  let player=rows.find(r=>normName(r.name)===queryName);
  if(!player){
    player=rows.find(r=>normName(r.name).includes(queryName)||queryName.includes(normName(r.name)));
  }
  if(!player){content.innerHTML=renderDebug(rawName,queryName,rows);return;}
  const leader=rows[0];
  const behind=leader?Math.max(0,cleanNumber(leader.points)-cleanNumber(player.points)):0;
  const ratings=getRatings(player,rows);
  const played=cleanNumber(player.played);
  const hitPct=played?Math.round(((cleanNumber(player.exact)+cleanNumber(player.diff)+cleanNumber(player.outcome))/played)*100):0;
  const ppm=played?(cleanNumber(player.points)/played).toFixed(1).replace(".",","):"0";
  const initials=getInitials(player.name);
  const nameParts=getShortNameParts(player.name);
  content.innerHTML=`
    <div class="profile-layout">
      <div><div class="fut-card"><div class="fut-top"><div><div class="ovr">${ratings.ovr}<span>OVR</span></div></div><div class="card-logo">FCB</div></div><div class="player-photo-wrap"><img id="profilePhoto" class="player-photo" alt="${player.name||""}" onerror="handlePhotoError(this,'${initials}')"></div><div class="card-name">${nameParts.map(p=>`<span>${p}</span>`).join("")}</div><div class="card-stats"><div class="card-stat"><strong>${pretty(player.points)}</strong><span>POENG</span></div><div class="card-stat"><strong>${pretty(behind)}</strong><span>BAK LEDER</span></div><div class="card-stat"><strong>${ppm}</strong><span>POENG/KAMP</span></div><div class="card-stat"><strong>${pretty(player.exact)}</strong><span>EKSAKTE</span></div></div></div></div>
      <div>
        <div class="panel"><h2 class="section-title">Kortanalyse</h2><div class="note">${cleanNumber(player.rank)<=3?"Topp 3 akkurat nå. Dette er skjermdump-materiale.":"Solid turnering så langt. Fortsatt mye poeng å spille om."}</div></div>
        <div class="panel"><h2 class="section-title">Statistikk</h2><div class="mini-grid"><div class="mini-box"><strong>${hitPct}%</strong><span>treffprosent</span></div><div class="mini-box"><strong>${pretty(player.underdog)}</strong><span>outsider</span></div><div class="mini-box"><strong>${pretty(player.exact)}</strong><span>eksakte</span></div></div></div>
        ${renderRtg(player)}
        <div class="panel"><h2 class="section-title">Bonusvalg</h2><div class="compact-list">${renderBonus("Toppscorer","⚽",player.top_scorer_all||player.top_scorer,player.top_scorer_points_all||player.top_scorer_points)}${renderBonus("Beste spiller","⭐",player.best_player_all||player.best_player,player.best_player_points_all||player.best_player_points)}</div></div>
        ${renderNextTips(player)}${renderLastResults(player)}${renderMatchHistory(historyRows,player)}
      </div>
    </div>`;
  const img=document.getElementById("profilePhoto");
  setPhoto(img,player.name,rows);
}
loadProfile();
</script>
</body>
</html>
