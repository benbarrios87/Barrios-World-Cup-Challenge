<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil | FC Barrios World Cup Challenge 2026</title>

<style>
:root{
  --card:rgba(7,14,28,0.84);
  --line:rgba(255,255,255,0.14);
  --muted:rgba(255,255,255,0.72);
  --green:#2ecc71;
  --gold:#ffd166;
  --red:#ff5e5e;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(46,204,113,0.24), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,209,102,0.14), transparent 28%),
    linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.88)),
    repeating-linear-gradient(90deg,#0b3d24 0px,#0b3d24 90px,#0e4a2c 90px,#0e4a2c 180px);
}

.wrapper{
  max-width:1050px;
  margin:auto;
  padding:22px;
}

.back-link{
  display:inline-block;
  margin-bottom:18px;
  color:white;
  text-decoration:none;
  opacity:0.8;
}

.hero{
  text-align:center;
  margin-bottom:22px;
}

.badge{
  display:inline-block;
  margin-bottom:12px;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(46,204,113,0.18);
  color:#9dffc7;
  font-size:13px;
  font-weight:bold;
}

.hero h1{
  font-size:42px;
  margin:0 0 10px;
}

.hero p{
  margin:0;
  color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
  box-shadow:0 16px 40px rgba(0,0,0,0.32);
}

.profile-top{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:20px;
  align-items:center;
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  font-weight:bold;
  background:linear-gradient(135deg, rgba(46,204,113,0.35), rgba(255,209,102,0.24));
  border:2px solid rgba(255,255,255,0.14);
}

.profile-name{
  font-size:34px;
  font-weight:bold;
  margin-bottom:8px;
}

.profile-sub{
  color:var(--muted);
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat-box{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  padding:18px;
  text-align:center;
}

.stat-box strong{
  display:block;
  font-size:30px;
  margin-bottom:5px;
  color:var(--gold);
}

.stat-box span{
  color:var(--muted);
  font-size:13px;
}

.section-title{
  margin:0 0 16px;
  font-size:24px;
}

.tip-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.tip-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
}

.tip-match{
  font-weight:bold;
  font-size:18px;
}

.tip-score{
  font-size:24px;
  font-weight:bold;
  color:var(--gold);
  text-align:right;
}

.tip-id{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
}

.match-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.pill{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:999px;
  padding:6px 10px;
  font-size:13px;
}

.pill.good{
  background:rgba(46,204,113,0.14);
  border-color:rgba(46,204,113,0.25);
  color:#9dffc7;
}

.pill.bad{
  background:rgba(255,94,94,0.12);
  border-color:rgba(255,94,94,0.25);
  color:#ffb4b4;
}

.pill.gold{
  background:rgba(255,209,102,0.13);
  border-color:rgba(255,209,102,0.25);
  color:var(--gold);
}

.bonus-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.bonus-card{
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:18px;
  padding:18px;
}

.bonus-card h3{
  margin-top:0;
}

.bonus-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.bonus-row:last-child{
  border-bottom:none;
}

.loading{
  color:var(--muted);
  text-align:center;
  padding:30px;
}

.error{
  color:#ffb4b4;
}

.footer-note{
  color:var(--muted);
  text-align:center;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:850px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .bonus-grid{ grid-template-columns:1fr; }
}

@media(max-width:650px){
  .wrapper{ padding:14px; }
  .hero h1{ font-size:32px; }
  .profile-top{
    grid-template-columns:1fr;
    text-align:center;
  }
  .avatar{ margin:auto; }
  .grid{ grid-template-columns:1fr; }
  .tip-top{ grid-template-columns:1fr; }
  .tip-score{
    font-size:20px;
    text-align:left;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <a class="back-link" href="leaderboard.html">← Til leaderboard</a>

  <div id="content">
    <div class="card loading">Laster profil...</div>
  </div>

  <div class="footer-note">
    FC Barrios World Cup Challenge 2026
  </div>

</div>

<script>
const SHEET_ID = "1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo";

const REGISTRATIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_REGISTRATIONS`;
const SUBMISSIONS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_SUBMISSIONS`;
const MATCHES_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_MATCHES`;
const RESULTS_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_RESULTS`;
const OUTCOME_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_OUTCOME`;
const DIFF_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_DIFF`;
const EXACT_URL = `https://opensheet.elk.sh/${SHEET_ID}/API_EXACT`;

async function fetchSheet(url){
  try{
    const response = await fetch(url, { cache:"no-store" });
    const data = await response.json();
    if(!Array.isArray(data)) return [];
    return data.map(normalizeRow);
  }catch(error){
    console.error(error);
    return [];
  }
}

function normalizeRow(row){
  const clean = {};
  Object.keys(row || {}).forEach(key => {
    const cleanKey = String(key)
      .trim()
      .toLowerCase()
      .replace(/\s+/g,"_")
      .replace(/-/g,"_");

    clean[cleanKey] = typeof row[key] === "string"
      ? row[key].trim()
      : row[key];
  });
  return clean;
}

function isBlank(value){
  return value === "" || value === null || value === undefined;
}

function cleanNumber(value){
  if(isBlank(value)) return 0;
  return Number(String(value).replace(/\s/g,"").replace(",",".")) || 0;
}

function parseTier(value){
  if(isBlank(value)) return 4;
  const found = String(value).match(/[1-4]/);
  return found ? Number(found[0]) : 4;
}

function getInitials(name){
  return String(name || "")
    .split(" ")
    .map(part => part[0] || "")
    .join("")
    .slice(0,2)
    .toUpperCase();
}

function getQueryName(){
  const params = new URLSearchParams(window.location.search);
  return params.get("name") || "";
}

function getOutcome(home,away){
  home = cleanNumber(home);
  away = cleanNumber(away);

  if(home > away) return "home";
  if(away > home) return "away";
  return "draw";
}

function getTierType(match,outcome){
  if(outcome === "draw") return "draw";

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);

  if(outcome === "home"){
    return homeTier <= awayTier ? "favorite" : "underdog";
  }

  if(outcome === "away"){
    return awayTier <= homeTier ? "favorite" : "underdog";
  }

  return "draw";
}

function getRulePoint(rules,tierDiff,type){
  const row = rules.find(r => cleanNumber(r.tier_diff) === cleanNumber(tierDiff));
  if(!row) return 0;

  if(type === "favorite") return cleanNumber(row.favorite || row.favoritt);
  if(type === "draw") return cleanNumber(row.draw || row.uavgjort);
  if(type === "underdog") return cleanNumber(row.underdog || row.outsider);

  return 0;
}

function getLatestRowsForPhone(rows, phone){
  const userRows = rows.filter(row =>
    String(row.phone || "").trim() === String(phone || "").trim()
  );

  if(userRows.length === 0) return [];

  const latestTimestamp = userRows[userRows.length - 1].timestamp;

  return userRows.filter(row => row.timestamp === latestTimestamp);
}

function hasResult(result){
  return result &&
    !isBlank(result.actual_home) &&
    !isBlank(result.actual_away);
}

function calculateMatch(tip, match, result, outcomeRules, diffRules, exactRules){
  if(!match || !hasResult(result)){
    return {
      status:"Ikke spilt",
      points:0,
      className:"",
      actualText:"Ikke spilt"
    };
  }

  if(isBlank(tip.tips_home) || isBlank(tip.tips_away)){
    return {
      status:"Mangler tips",
      points:0,
      className:"bad",
      actualText:`${result.actual_home} - ${result.actual_away}`
    };
  }

  const tipHome = cleanNumber(tip.tips_home);
  const tipAway = cleanNumber(tip.tips_away);
  const actualHome = cleanNumber(result.actual_home);
  const actualAway = cleanNumber(result.actual_away);

  const tipOutcome = getOutcome(tipHome,tipAway);
  const actualOutcome = getOutcome(actualHome,actualAway);

  const tipDiff = tipHome - tipAway;
  const actualDiff = actualHome - actualAway;

  const homeTier = parseTier(match.tier_home);
  const awayTier = parseTier(match.tier_away);
  const tierDiff = Math.abs(homeTier - awayTier);
  const tierType = getTierType(match,tipOutcome);

  if(tipHome === actualHome && tipAway === actualAway){
    return {
      status:"Eksakt resultat",
      points:getRulePoint(exactRules,tierDiff,tierType),
      className:"gold",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipDiff === actualDiff){
    return {
      status:"Riktig målforskjell",
      points:getRulePoint(diffRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  if(tipOutcome === actualOutcome){
    return {
      status:"Riktig utfall",
      points:getRulePoint(outcomeRules,tierDiff,tierType),
      className:"good",
      actualText:`${actualHome} - ${actualAway}`
    };
  }

  return {
    status:"Bom",
    points:0,
    className:"bad",
    actualText:`${actualHome} - ${actualAway}`
  };
}

function renderBonusRows(rows){
  const positive = rows.filter(row => cleanNumber(row.extra_points) > 0);

  if(positive.length === 0){
    return `<div style="color:rgba(255,255,255,0.7);">Ikke fylt ut.</div>`;
  }

  return positive.map(row => `
    <div class="bonus-row">
      <span>${row.extra_name || "-"}</span>
      <strong>${row.extra_points || 0}</strong>
    </div>
  `).join("");
}

async function loadProfile(){
  const content = document.getElementById("content");
  const queryName = getQueryName().trim().toLowerCase();

  if(!queryName){
    content.innerHTML = `<div class="card error">Mangler navn i URL.</div>`;
    return;
  }

  try{
    const [
      registrations,
      submissions,
      matches,
      results,
      outcomeRules,
      diffRules,
      exactRules
    ] = await Promise.all([
      fetchSheet(REGISTRATIONS_URL),
      fetchSheet(SUBMISSIONS_URL),
      fetchSheet(MATCHES_URL),
      fetchSheet(RESULTS_URL),
      fetchSheet(OUTCOME_URL),
      fetchSheet(DIFF_URL),
      fetchSheet(EXACT_URL)
    ]);

    const player = registrations.find(row => {
      const fullName =
        row.full_name ||
        row["full name"] ||
        `${row.first_name || row["first name"] || ""} ${row.last_name || row["last name"] || ""}`.trim();

      return fullName.trim().toLowerCase() === queryName;
    });

    if(!player){
      content.innerHTML = `<div class="card error">Fant ikke denne spilleren.</div>`;
      return;
    }

    const playerName =
      player.full_name ||
      player["full name"] ||
      `${player.first_name || player["first name"] || ""} ${player.last_name || player["last name"] || ""}`.trim();

    const phone = String(player.phone || "").trim();
    const latestRows = getLatestRowsForPhone(submissions,phone);

    const matchRows = latestRows.filter(row => row.type === "match");
    const bestPlayerRows = latestRows.filter(row => row.type === "bestplayer");
    const topScorerRows = latestRows.filter(row => row.type === "topscorer");

    const matchMap = {};
    matches.forEach(match => {
      const id = String(match.id || match.match_id || "").trim();
      if(id) matchMap[id] = match;
    });

    const resultMap = {};
    results.forEach(result => {
      const id = String(result.id || result.match_id || "").trim();
      if(id) resultMap[id] = result;
    });

    let totalPoints = 0;
    let exactCount = 0;
    let diffCount = 0;
    let outcomeCount = 0;
    let playedCount = 0;

    const tipsHtml = matchRows.map(row => {
      const matchId = String(row.match_id || row.id || "").trim();
      const match = matchMap[matchId];
      const result = resultMap[matchId];

      const calc = calculateMatch(
        row,
        match,
        result,
        outcomeRules,
        diffRules,
        exactRules
      );

      totalPoints += calc.points;

      if(calc.status !== "Ikke spilt") playedCount++;
      if(calc.status === "Eksakt resultat") exactCount++;
      if(calc.status === "Riktig målforskjell") diffCount++;
      if(calc.status === "Riktig utfall") outcomeCount++;

      return `
        <div class="tip-card">
          <div class="tip-top">
            <div>
              <div class="tip-match">
                ${match ? `${match.home} vs ${match.away}` : `Kamp ${matchId}`}
              </div>
              <div class="tip-id">Kamp ${matchId}</div>
            </div>

            <div class="tip-score">
              ${isBlank(row.tips_home) || isBlank(row.tips_away)
                ? "Mangler"
                : `${row.tips_home} - ${row.tips_away}`
              }
            </div>
          </div>

          <div class="match-meta">
            <span class="pill">Resultat: ${calc.actualText}</span>
            <span class="pill ${calc.className}">${calc.status}</span>
            <span class="pill gold">${calc.points} poeng</span>
          </div>
        </div>
      `;
    }).join("");

    content.innerHTML = `
      <div class="hero">
        <div class="badge">FC BARRIOS • PROFIL</div>
        <h1>Spillerprofil</h1>
        <p>Full oversikt over tips, poeng og treff.</p>
      </div>

      <div class="card">
        <div class="profile-top">
          <div class="avatar">${getInitials(playerName)}</div>

          <div>
            <div class="profile-name">${playerName}</div>
            <div class="profile-sub">
              ${latestRows.length ? "Tips funnet" : "Ingen tips registrert ennå"}
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="grid">
          <div class="stat-box">
            <strong>${totalPoints}</strong>
            <span>Totalpoeng</span>
          </div>

          <div class="stat-box">
            <strong>${exactCount}</strong>
            <span>Eksakte treff</span>
          </div>

          <div class="stat-box">
            <strong>${diffCount}</strong>
            <span>Diff-treff</span>
          </div>

          <div class="stat-box">
            <strong>${outcomeCount}</strong>
            <span>Riktige utfall</span>
          </div>
        </div>
      </div>

      <div class="bonus-grid">
        <div class="bonus-card">
          <h3>Beste spiller</h3>
          ${renderBonusRows(bestPlayerRows)}
        </div>

        <div class="bonus-card">
          <h3>Toppscorer</h3>
          ${renderBonusRows(topScorerRows)}
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Kamptips</h2>
        ${tipsHtml || `<div style="color:rgba(255,255,255,0.7);">Ingen tips registrert.</div>`}
      </div>
    `;

  }catch(error){
    console.error(error);
    content.innerHTML = `<div class="card error">Klarte ikke å laste profil.</div>`;
  }
}

loadProfile();
</script>

</body>
</html>
