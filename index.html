<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barrios World Cup Challenge 2026</title>

<style>
:root{
  --bg:#07111f;
  --card:rgba(255,255,255,0.08);
  --line:rgba(255,255,255,0.12);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.7);
  --green:#2ecc71;
  --red:#ff4757;
  --gold:#ffd166;
  --blue:#4dabf7;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top left,#123,#07111f 60%);
  color:var(--text);
  min-height:100vh;
}

.wrapper{
  max-width:980px;
  margin:auto;
  padding:18px;
}

.hero{
  text-align:center;
  margin-bottom:22px;
}

.hero h1{
  font-size:38px;
  margin-bottom:8px;
}

.hero p{
  color:var(--muted);
  margin:0;
}

.top-box{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
}

.name-field{
  width:100%;
  box-sizing:border-box;
  height:48px;
  border:none;
  border-radius:14px;
  padding:0 14px;
  font-size:18px;
  margin-top:8px;
}

.progress{
  margin-top:16px;
}

.progress-row{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:14px;
  margin-bottom:8px;
}

.progress-bar{
  height:12px;
  background:rgba(255,255,255,0.08);
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--green);
  transition:0.25s;
}

.section-title{
  margin:26px 0 12px;
  font-size:22px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  backdrop-filter:blur(10px);
}

.match-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.match-title{
  font-weight:bold;
  font-size:15px;
}

.group{
  background:rgba(255,255,255,0.08);
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  white-space:nowrap;
}

.teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;
  align-items:center;
}

.team{
  background:rgba(255,255,255,0.05);
  padding:11px 8px;
  border-radius:13px;
  text-align:center;
  min-height:44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}

.team-name{
  font-weight:bold;
  font-size:14px;
}

.tier{
  display:inline-block;
  margin:auto;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  font-weight:bold;
  background:rgba(255,255,255,0.12);
  color:white;
}

.tier-1{ background:rgba(255,209,102,0.25); color:var(--gold); }
.tier-2{ background:rgba(77,171,247,0.22); color:var(--blue); }
.tier-3{ background:rgba(46,204,113,0.22); color:var(--green); }
.tier-4{ background:rgba(255,71,87,0.22); color:#ff9aa8; }

.score{
  display:flex;
  gap:7px;
  justify-content:center;
  align-items:center;
}

.score input{
  width:48px;
  height:42px;
  border:none;
  border-radius:12px;
  font-size:20px;
  text-align:center;
  background:white;
  color:#111;
  font-weight:bold;
}

.submit-btn{
  width:100%;
  height:58px;
  border:none;
  border-radius:16px;
  background:var(--green);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  margin:24px 0 30px;
}

.submit-btn:hover{
  opacity:0.9;
}

.loading{
  color:var(--muted);
  text-align:center;
  padding:30px;
}

@media(max-width:700px){
  .wrapper{
    padding:12px;
  }

  .hero h1{
    font-size:28px;
  }

  .teams{
    grid-template-columns:1fr;
  }

  .score{
    order:2;
  }

  .team{
    min-height:auto;
  }

  .match-header{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="hero">
    <h1>🏆 Barrios World Cup Challenge 2026</h1>
    <p>Tipp VM. Treff outsiders. Vinn evig skryterett.</p>
  </div>

  <div class="top-box">
    <label for="playerName"><strong>Navn / brukernavn</strong></label>
    <input id="playerName" class="name-field" type="text" placeholder="Skriv navnet ditt her">

    <div class="progress">
      <div class="progress-row">
        <span id="progressText">0 / 0 kamper fylt ut</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <h2 class="section-title">Kamptips</h2>

  <div id="matches">
    <div class="loading">Laster kamper fra Google Sheets...</div>
  </div>

  <button class="submit-btn" onclick="submitTips()">
    Send inn tips
  </button>

</div>

<script>
const API_URL =
"https://opensheet.elk.sh/1Ud5i11MEUXwvKDDsfyxvNIdyJgMbY_pS50BkecyzhDo/API_MATCHES";

let allMatches = [];

async function loadMatches(){
  const container = document.getElementById("matches");

  try{
    const res = await fetch(API_URL);
    allMatches = await res.json();

    container.innerHTML = "";

    allMatches.forEach((match, index) => {
      const homeTier = match.tier_home || "";
      const awayTier = match.tier_away || "";

      container.innerHTML += `
        <div class="card">
          <div class="match-header">
            <div class="match-title">${match.home} vs ${match.away}</div>
            <div class="group">Gruppe ${match.group || ""}</div>
          </div>

          <div class="teams">
            <div class="team">
              <div class="team-name">${match.home}</div>
              <div class="tier tier-${homeTier}">Tier ${homeTier}</div>
            </div>

            <div class="score">
              <input 
                type="number" 
                min="0" 
                inputmode="numeric"
                data-match-id="${match.id}"
                data-side="home"
                oninput="updateProgress()"
              >
              <span>-</span>
              <input 
                type="number" 
                min="0" 
                inputmode="numeric"
                data-match-id="${match.id}"
                data-side="away"
                oninput="updateProgress()"
              >
            </div>

            <div class="team">
              <div class="team-name">${match.away}</div>
              <div class="tier tier-${awayTier}">Tier ${awayTier}</div>
            </div>
          </div>
        </div>
      `;
    });

    updateProgress();

  }catch(error){
    container.innerHTML = `
      <div class="card">
        Klarte ikke å laste kampene. Sjekk at Google Sheet er delt som "Alle med linken kan se".
      </div>
    `;
    console.error(error);
  }
}

function updateProgress(){
  const total = allMatches.length;
  let completed = 0;

  allMatches.forEach(match => {
    const homeInput = document.querySelector(`input[data-match-id="${match.id}"][data-side="home"]`);
    const awayInput = document.querySelector(`input[data-match-id="${match.id}"][data-side="away"]`);

    if(homeInput && awayInput && homeInput.value !== "" && awayInput.value !== ""){
      completed++;
    }
  });

  const percent = total ? Math.round((completed / total) * 100) : 0;

  document.getElementById("progressText").textContent = `${completed} / ${total} kamper fylt ut`;
  document.getElementById("progressPercent").textContent = `${percent}%`;
  document.getElementById("progressFill").style.width = `${percent}%`;
}

function submitTips(){
  const name = document.getElementById("playerName").value.trim();

  if(!name){
    alert("Skriv inn navn først.");
    return;
  }

  const tips = allMatches.map(match => {
    const homeInput = document.querySelector(`input[data-match-id="${match.id}"][data-side="home"]`);
    const awayInput = document.querySelector(`input[data-match-id="${match.id}"][data-side="away"]`);

    return {
      id: match.id,
      home: match.home,
      away: match.away,
      tips_home: homeInput ? homeInput.value : "",
      tips_away: awayInput ? awayInput.value : ""
    };
  });

  console.log({
    name,
    tips
  });

  alert("Foreløpig test: Tipsene ligger nå i console. Neste steg er å sende dem til Google Sheets.");
}

loadMatches();
</script>

</body>
</html>
